<style>
:root{--green:#008000;--green-dark:#006400;--green-soft:#E0EFE0;--yellow:#FFFF00;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--bg:#f5f7f5;--red:#b91c1c;--amber:#b7791f;}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
header.top{background:var(--green);color:#fff;border-bottom:5px solid var(--yellow);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:1px}.brand small{display:block;font-size:10px;letter-spacing:2px;opacity:.85;text-transform:uppercase;font-weight:500}
.spacer{flex:1}
.whoami{font-size:13px;opacity:.95}
main{max-width:900px;margin:0 auto;padding:20px 16px 80px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin:0 auto}
.h1{font-size:22px;font-weight:800;color:var(--green-dark);margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
td input{width:96px;padding:6px 8px;font-size:14px}
td input.stock{width:70px}
select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:118px;line-height:1.5;resize:vertical}
td select{width:auto;padding:6px 8px;font-size:14px}
input[readonly],textarea[readonly]{background:var(--bg);color:var(--muted);cursor:not-allowed}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;font-size:15px;background:var(--green);color:#fff;cursor:pointer}
.btn:hover{background:var(--green-dark)}.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-block{display:block;width:100%}
.btn-ghost{background:#fff;color:var(--green-dark);border:1.5px solid var(--green)}
.btn-ghost:hover{background:var(--green-dark);color:#fff;border-color:var(--green-dark)}
.btn-sm{padding:7px 11px;font-size:13px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px;background:#fff}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--green);color:#fff;font-weight:600}
tbody tr:nth-child(even){background:#f7faf8}
.msg{padding:10px 14px;border-radius:10px;font-size:14px;margin:10px 0}
.msg.err{background:#fde3e3;color:var(--red)}
.msg.ok{background:var(--green-soft);color:var(--green-dark)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--green-soft);color:var(--green-dark)}
.pill.amber{background:#fdf3d7;color:var(--amber)}.pill.red{background:#fde3e3;color:var(--red)}
.role{background:var(--yellow);color:var(--green-dark);font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px}
.flag{background:#111827;color:#ffe9a8;text-align:center;font-size:12px;padding:5px 8px}
.muted{color:var(--muted);font-size:13px}
.loginwrap{max-width:380px;margin:8vh auto 0}
.nav{max-width:900px;margin:0 auto;padding:14px 16px 0;display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1.5px solid var(--green);background:#fff;color:var(--green-dark);border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.tab.active{background:var(--green);color:#fff}
.actions{white-space:nowrap}.actions .btn{margin-right:6px}
.pwwrap{position:relative}.pwwrap input{padding-right:44px}
.pwtoggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:18px;line-height:1;cursor:pointer;padding:4px;opacity:.7}
.pwtoggle:hover{opacity:1}
.grid{display:grid;gap:14px}
.products{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.product{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pname{font-weight:700}
.pcat{font-size:12px;color:var(--muted)}
.pprice{font-size:18px;font-weight:800;color:var(--green-dark)}
.psize{font-size:12px;color:var(--muted)}
.radio{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer}
.radio>span{flex:1;min-width:0}.radio input{flex:none;margin:0;width:18px;height:18px}
.radio.sel{border-color:var(--green);background:var(--green-soft)}
.radio input{margin-top:3px}
.radio .t{font-weight:700}
.radio .d{font-size:13px;color:var(--muted)}
.sumrow{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.sumrow.total{font-size:19px;font-weight:800;color:var(--green-dark);border-top:2px solid var(--line);margin-top:6px;padding-top:10px}
.logo-img{max-width:72px;height:auto;display:block}
.pimg{height:130px;background:linear-gradient(135deg,var(--green-soft),#fffde7);display:grid;place-items:center;border-radius:12px;margin-bottom:10px}
.pimg img{max-width:84px;max-height:96px;object-fit:contain;display:block}
.pimg.detail{height:180px}.pimg.detail img{max-width:150px;max-height:150px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:100}
.modal-box{background:#fff;border-radius:14px;padding:18px;max-width:560px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35)}
</style>
</head>

var cart=[]; // [{variant_id, product_id, product_name, size_kg, unit_price_cents, qty}]
var distributorApproved=null;
function cartKey(){ return 'suthisa-app-cart-'+(me.user?me.user.id:'anon'); }
function loadCart(){ try{ cart=JSON.parse(localStorage.getItem(cartKey()))||[]; }catch(e){ cart=[]; } }
function saveCart(){ try{ localStorage.setItem(cartKey(), JSON.stringify(cart)); }catch(e){} }
function cartCount(){ return cart.reduce(function(a,l){return a+l.qty;},0); }
function cartSubtotal(){ return cart.reduce(function(a,l){return a+l.unit_price_cents*l.qty;},0); }

/* ---------- router ---------- */
function go(hash){ location.hash=hash; }
function parseHash(){ var h=(location.hash||'#/shop').replace(/^#\//,'').split('/'); return {view:h[0]||'shop', id:h[1]||''}; }
function renderRoute(){
  var r=parseHash();
  if(!me.user){  // guest (not logged in): public catalogue + package deal
    if(r.view==='product') return viewProduct(r.id);
    if(r.view==='deals')   return viewDeals();
    if(r.view==='login')   return renderLogin();
    if(r.view==='cart'||r.view==='checkout'||r.view==='orders') return renderLogin('Please sign in to order.');
    return viewShop();
  }
  if(me.role==='admin' && !me.stockOnly){
    // full admin
    if(r.view==='admin' && r.id==='orders'){ return viewAdminOrders(); }
    if(r.view==='admin' && r.id==='depots'){ return viewAdminDepots(); }
    if(r.view==='admin' && r.id==='settings'){ return viewAdminSettings(); }
    if(r.view==='admin' && r.id==='deals'){ return viewAdminDeals(); }
    if(r.view==='distributors'){ return loadDistributors(); }
    return loadCatalogue(); // default admin view (Products & stock)
  }
  if(me.stockOnly){ return loadStock(); }
  // distributor
  if(distributorApproved===false){ return shell('<div class="msg">Your distributor account is <b>pending approval</b>. You will be able to order once an admin approves it.</div>','shop'); }
  switch(r.view){
    case 'product':  return viewProduct(r.id);
    case 'cart':     return viewCart();
    case 'checkout': return viewCheckout();
    case 'confirm':  return viewConfirm(r.id);
    case 'orders':   return viewMyOrders();
    case 'deals':    return viewDeals();
    case 'profile':  return viewProfile();
    default:         return viewShop();
  }
}
window.addEventListener('hashchange', renderRoute);

/* ---------- boot ---------- */
sb.auth.getSession().then(function(res){
  if(res.data.session){ onSignedIn(res.data.session.user); } else { startGuest(); }
});
sb.auth.onAuthStateChange(function(_e, session){
  if(session && session.user){ if(!me.user) onSignedIn(session.user); }
  else { startGuest(); }
});

/* ---------- guest (not logged in) ---------- */
function startGuest(){ me={user:null, role:'guest', name:null, stockOnly:false}; renderRoute(); }

/* ---------- signed in ---------- */
function onSignedIn(user){
  me.user=user;
  sb.from('profiles').select('*').eq('id', user.id).single().then(function(r){
    me.role=(r.data && r.data.role) || 'unknown';
    me.name=(r.data && r.data.full_name) || user.email;
    me.stockOnly=!!(r.data && r.data.stock_only);   // DB-enforced stock-taker admin
    loadCart();
    if(me.role==='distributor'){
      sb.from('distributors').select('status').eq('profile_id', user.id).maybeSingle().then(function(d){
        distributorApproved = !!(d.data && d.data.status==='approved');
        if(!location.hash) location.hash='#/shop';
        renderRoute();
      });

function loadCatalogue(){
  shell('<div class="h1">Products &amp; stock</div><p class="sub">Edit names, sizes, prices (R) and stock — changes save automatically. Add or remove products and sizes below.</p><div id="cat" class="muted">Loading catalogue…</div>', 'catalogue');
  sb.from('products').select('id,name,category,product_variants(id,size_kg,wholesale_price_cents,retail_price_cents,stock_qty,low_stock_threshold)').order('name')
    .then(function(r){
      var cat=document.getElementById('cat');
      if(r.error){ cat.innerHTML='<div class="msg err">Could not load products: '+esc(r.error.message)+'</div>'; return; }
      var products=r.data||[];
      var onlyOne=products.length<=1;
      cat.innerHTML=products.map(function(p){
        var variants=(p.product_variants||[]).slice().sort(function(a,b){return a.size_kg-b.size_kg;});
        var rows=variants.map(function(v){
          var low=v.stock_qty<=(v.low_stock_threshold==null?10:v.low_stock_threshold);
          return '<tr>'
            +'<td><input type="number" min="1" step="0.5" class="stock" data-f="size_kg" data-id="'+v.id+'" value="'+v.size_kg+'"> kg</td>'
            +'<td>R <input type="number" min="0" step="0.01" data-f="wholesale_price_cents" data-id="'+v.id+'" value="'+(v.wholesale_price_cents/100).toFixed(2)+'"></td>'
            +'<td>R <input type="number" min="0" step="0.01" data-f="retail_price_cents" data-id="'+v.id+'" value="'+(v.retail_price_cents/100).toFixed(2)+'"></td>'
            +'<td><input type="number" min="0" class="stock" data-f="stock_qty" data-id="'+v.id+'" value="'+v.stock_qty+'"> '+(low?'<span class="pill '+(v.stock_qty<=0?'red':'amber')+'">low</span>':'')+'</td>'
            +'<td><b>'+zar(v.wholesale_price_cents*v.stock_qty)+'</b></td>'
            +'<td><button class="btn btn-ghost btn-sm" data-delvar="'+v.id+'" style="border-color:var(--red);color:var(--red)">Remove</button></td></tr>';
        }).join('')||'<tr><td colspan="6" class="muted">No sizes yet — add one below.</td></tr>';
        return '<div class="card" style="margin-bottom:14px">'
          +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'

          +'</div>'
          +'<div class="tablewrap"><table><thead><tr><th>Size</th><th>Wholesale</th><th>Retail</th><th>Stock</th><th>Value</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'
          +'<button class="btn btn-sm" data-addsize="'+p.id+'" style="margin-top:10px;background:var(--yellow);color:var(--green-dark)">+ Add size</button>'
        +'</div>';
      }).join('')
      +'<div class="card" style="max-width:520px"><b>Add a product</b>'
        +'<label>Name</label><input type="text" id="npname" placeholder="e.g. Maize Meal">'
        +'<label>Category</label><input type="text" id="npcat" placeholder="Maize Meal">'
        +'<button class="btn" id="npadd" style="margin-top:10px">Add product</button></div><div id="savemsg"></div>';
      function msg(html){ var m=document.getElementById('savemsg'); if(!m) return; m.innerHTML=html; if(html) setTimeout(function(){ if(m) m.innerHTML=''; }, 2500); }
      cat.addEventListener('change', function(ev){
        var el=ev.target;
        if(el.getAttribute && el.getAttribute('data-pf')){   // product name / category
          var pv=(el.value||'').trim();
          if(el.getAttribute('data-pf')==='name' && !pv){ msg('<div class="msg err">Name cannot be empty.</div>'); loadCatalogue(); return; }
          var pp={}; pp[el.getAttribute('data-pf')]=pv; el.disabled=true;
          sb.from('products').update(pp).eq('id', el.getAttribute('data-pid')).then(function(rr){ el.disabled=false; msg(rr.error?'<div class="msg err">Save failed: '+esc(rr.error.message)+'</div>':'<div class="msg ok">Saved ✓</div>'); });
          return;
        }
        if(el.getAttribute && el.getAttribute('data-f')){    // variant size / price / stock
          var field=el.getAttribute('data-f'), vid=el.getAttribute('data-id');
          var val = field==='stock_qty' ? parseInt(el.value||0,10) : field==='size_kg' ? parseFloat(el.value||0) : Math.round(parseFloat(el.value||0)*100);
          if(field==='size_kg' && (!val || val<=0)){ msg('<div class="msg err">Size must be greater than 0.</div>'); loadCatalogue(); return; }
          var patch={}; patch[field]=val; el.disabled=true;
          sb.from('product_variants').update(patch).eq('id', vid).then(function(rr){ el.disabled=false; msg(rr.error?'<div class="msg err">Save failed: '+esc(rr.error.message)+'</div>':'<div class="msg ok">Saved ✓</div>'); });
          return;
        }
      });
      cat.addEventListener('click', function(ev){
        var as=ev.target.closest && ev.target.closest('[data-addsize]');
        if(as){ var kg=prompt('New size in kg (e.g. 25):'); if(kg===null) return; kg=parseFloat(kg); if(!kg||kg<=0){ msg('<div class="msg err">Enter a valid size in kg.</div>'); return; }
          sb.from('product_variants').insert({product_id:as.getAttribute('data-addsize'), size_kg:kg, wholesale_price_cents:0, retail_price_cents:0, stock_qty:0}).then(function(rr){ msg(rr.error?'<div class="msg err">Add size failed (that size may already exist): '+esc(rr.error.message)+'</div>':''); if(!rr.error) loadCatalogue(); }); return; }
        var dv=ev.target.closest && ev.target.closest('[data-delvar]');
        if(dv){ if(!confirm('Remove this size?')) return; sb.from('product_variants').delete().eq('id', dv.getAttribute('data-delvar')).then(function(rr){ if(rr.error){ msg('<div class="msg err">Remove failed (it may be used by an existing order): '+esc(rr.error.message)+'</div>'); return; } loadCatalogue(); }); return; }
        var dp=ev.target.closest && ev.target.closest('[data-delprod]');
        if(dp){ if(!confirm('Delete this product and all its sizes?')) return; sb.from('products').delete().eq('id', dp.getAttribute('data-delprod')).then(function(rr){ if(rr.error){ msg('<div class="msg err">Delete failed (it may be used by an existing order): '+esc(rr.error.message)+'</div>'); return; } loadCatalogue(); }); return; }
        if(ev.target.id==='npadd'){ var n=(document.getElementById('npname').value||'').trim(), c=(document.getElementById('npcat').value||'').trim()||'Maize Meal'; if(!n){ msg('<div class="msg err">Product name is required.</div>'); return; } ev.target.disabled=true; sb.from('products').insert({name:n, category:c}).then(function(rr){ ev.target.disabled=false; if(rr.error){ msg('<div class="msg err">Add failed: '+esc(rr.error.message)+'</div>'); return; } loadCatalogue(); }); return; }
      });
    });
}
/* ---------- stock-taker admin (stock quantities only) ---------- */
function loadStock(){
  shell('<div class="h1">Stock take</div><p class="sub">Update stock quantities only — prices are managed by an admin. Changes save automatically.</p><div id="stk" class="muted">Loading…</div>', 'stock');
  sb.from('products').select('id,name,product_variants(id,size_kg,stock_qty,low_stock_threshold)').order('name')
    .then(function(r){
      var box=document.getElementById('stk');
      if(r.error){ box.innerHTML='<div class="msg err">Could not load stock: '+esc(r.error.message)+'</div>'; return; }
      var products=r.data||[];
      if(!products.length){ box.innerHTML='<div class="msg">No products yet.</div>'; return; }
      box.innerHTML=products.map(function(p){
        var variants=(p.product_variants||[]).slice().sort(function(a,b){return a.size_kg-b.size_kg;});
        var rows=variants.map(function(v){
          var low=v.stock_qty<=(v.low_stock_threshold==null?10:v.low_stock_threshold);
          return '<tr><td>'+v.size_kg+' kg</td><td><input type="number" min="0" class="stock" data-id="'+v.id+'" value="'+v.stock_qty+'"> '+(low?'<span class="pill '+(v.stock_qty<=0?'red':'amber')+'">low</span>':'')+'</td></tr>';
        }).join('')||'<tr><td colspan="2" class="muted">No sizes.</td></tr>';
        return '<div class="card" style="margin-bottom:14px"><b>'+esc(p.name)+'</b><div class="tablewrap"><table><thead><tr><th>Size</th><th>Stock</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
      }).join('')+'<div id="savemsg"></div>';
      box.addEventListener('change', function(ev){
        var el=ev.target; if(!el.getAttribute || !el.classList || !el.classList.contains('stock')) return;
        var vid=el.getAttribute('data-id'), qty=parseInt(el.value||0,10);
        el.disabled=true;
        sb.rpc('set_variant_stock', { p_variant_id: vid, p_qty: qty }).then(function(rr){   // DB function: stock only, never prices
          el.disabled=false;
          var m=document.getElementById('savemsg');
          m.innerHTML = rr.error ? '<div class="msg err">Save failed: '+esc(rr.error.message)+'</div>' : '<div class="msg ok">Saved ✓</div>';
          setTimeout(function(){ if(m) m.innerHTML=''; }, 2000);
        });
      });
    });
}

/* ---------- shop + product (distributor) ---------- */
var catalogueCache=null, detailSel={};
function loadCatalogueData(cb){
  if(catalogueCache){ return cb(catalogueCache); }
  sb.from('products').select('id,name,category,description,product_variants(id,size_kg,wholesale_price_cents,stock_qty,low_stock_threshold)')
    .eq('is_active',true).order('name').then(function(r){
      if(r.error){ cb(null, r.error); return; }
      (r.data||[]).forEach(function(p){ (p.product_variants||[]).sort(function(a,b){return a.size_kg-b.size_kg;}); });
      catalogueCache=r.data||[]; cb(catalogueCache);
    });
}
var dealsCache=null;
function loadDeals(cb){
  if(dealsCache){ return cb(dealsCache); }
  sb.from('deals').select('*').order('sort_order').order('title')
    .then(function(r){ dealsCache = r.error ? [] : (r.data||[]); cb(dealsCache); });
}
function kgFmt(n){ n=Number(n)||0; var s=(Math.round(n*100)/100).toString().split('.'); s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,' '); return s.join('.'); }
function dealBuildable(d){ return d && d.target_kg!=null && (d.allowed_sizes||[]).length>0; }
function dealBuilderHtml(d){
  var sizes=(d.allowed_sizes||[]).map(Number).sort(function(a,b){return a-b;});
  var tgt=Number(d.target_kg);
  var rows=sizes.map(function(s){
    return '<div class="sumrow"><span>'+kgFmt(s)+' kg &nbsp;×&nbsp; <input type="number" min="0" step="1" value="0" data-qty data-deal="'+d.id+'" data-kg="'+s+'" style="width:76px;display:inline-block"></span><span data-sub data-deal="'+d.id+'" data-kg="'+s+'">0 kg</span></div>';
  }).join('');
  return '<div class="pkgbuild" data-build="'+d.id+'" style="margin-top:10px">'
    +'<div style="font-weight:700;margin-bottom:6px">Build your package — must total '+kgFmt(tgt)+' kg</div>'
    +rows
    +'<div class="sumrow total"><span>Total</span><span data-total="'+d.id+'">0 / '+kgFmt(tgt)+' kg</span></div>'
    +'<div class="muted" data-hint="'+d.id+'" style="margin-top:4px">'+kgFmt(tgt)+' kg to go.</div>'
    +'<button class="btn btn-block" data-submitdeal="'+d.id+'" data-target="'+tgt+'" disabled style="margin-top:8px">Request this package</button>'
  +'</div>';
}
function recalcBuild(dealId){
  var root=document.querySelector('[data-build="'+dealId+'"]'); if(!root) return;
  var qtys=root.querySelectorAll('[data-qty][data-deal="'+dealId+'"]'), total=0;
  for(var i=0;i<qtys.length;i++){
    var kg=parseFloat(qtys[i].getAttribute('data-kg'))||0;
    var q=parseInt(qtys[i].value||0,10); if(isNaN(q)||q<0) q=0;
    var line=kg*q; total+=line;
    var sub=root.querySelector('[data-sub][data-deal="'+dealId+'"][data-kg="'+qtys[i].getAttribute('data-kg')+'"]');
    if(sub) sub.textContent=kgFmt(line)+' kg';
  }
  var btn=root.querySelector('[data-submitdeal="'+dealId+'"]');
  var tgt=Number(btn&&btn.getAttribute('data-target'))||0;
  var totEl=root.querySelector('[data-total="'+dealId+'"]'); if(totEl) totEl.textContent=kgFmt(total)+' / '+kgFmt(tgt)+' kg';
  var hint=root.querySelector('[data-hint="'+dealId+'"]');
  var ok=(Math.abs(total-tgt)<0.001 && total>0);
  if(btn) btn.disabled=!ok;
  if(hint){ hint.textContent = ok?'Ready to submit ✓' : (total>tgt?kgFmt(total-tgt)+' kg over.':kgFmt(tgt-total)+' kg to go.'); }
}
function dealMixHtml(items){
  items=items||[]; var total=0;
  var rows=items.map(function(it){ total+=Number(it.size_kg)*Number(it.qty); return '<br>'+kgFmt(it.size_kg)+' kg × '+esc(String(it.qty)); }).join('');
  return '<div class="msg" style="text-align:left;margin-top:8px"><b>Your package</b>'+rows+(total?'<br><b>Total '+kgFmt(total)+' kg</b>':'')+'</div>';
}
function dealBanner(deal){
  if(!deal) return '';
  return '<div class="card" data-open-deal="1" style="cursor:pointer;border:2px solid var(--yellow);background:#fffde7;display:flex;align-items:center;gap:12px;margin-bottom:14px">'
    +'<div style="font-size:32px">🚛</div>'
    +'<div style="flex:1"><b>'+esc(deal.title)+(deal.price_text?' — '+esc(deal.price_text):'')+'</b><div class="muted">'+esc(deal.subtitle||'Tap to view our package deals.')+'</div></div>'
    +'<span class="btn btn-sm" style="background:var(--yellow);color:var(--green-dark)">View deals</span></div>';
}
function viewDeals(){
  shell('<button class="btn btn-ghost btn-sm" data-nav="#/shop">‹ Back to shop</button>'
    +'<div class="h1" style="margin-top:8px">Package deals</div><p class="sub">Bulk offers — save on volume, packed to suit your business</p>'
    +'<div id="deals" class="muted">Loading…</div>', 'deals');
  loadDeals(function(deals){
    var box=document.getElementById('deals');
    var active=(deals||[]).filter(function(d){return d.is_active;});
    if(!active.length){ box.innerHTML='<div class="msg">No package deals available right now.</div>'; wireNav(); return; }
    function draw(reqMap){
      box.innerHTML=active.map(function(d){
        return '<div class="card" style="border:2px solid var(--yellow);margin-bottom:14px">'
          +'<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div style="font-size:42px">🚛</div>'
            +'<div><div class="pcat">Package deal</div><div style="font-size:20px;font-weight:800;color:var(--green-dark)">'+esc(d.title)+'</div></div>'
            +'<div style="flex:1"></div><div style="text-align:right"><div class="pprice">'+esc(d.price_text||'')+'</div><div class="muted">'+esc(d.total_text||'')+'</div></div></div>'
          +(d.subtitle?'<p class="sub" style="margin-top:8px">'+esc(d.subtitle)+'</p>':'')
          +(d.description?'<div class="msg">'+esc(d.description).replace(/\n/g,'<br>')+'</div>':'')
          +(d.example?'<div class="msg" style="text-align:left"><b>Example combination</b>'+String(d.example).split('\n').filter(function(x){return x.trim();}).map(function(x){x=x.trim();return /^(…|\.\.\.|or\b)/i.test(x)?'<br><span class="muted">'+esc(x)+'</span>':'<br>• '+esc(x);}).join('')+'</div>':'')
          +(me.user
              ? (reqMap[d.id] && reqMap[d.id].status==='pending'
                   ? '<div class="msg amber" style="margin-top:8px;text-align:center"><b>Pending — awaiting approval</b></div>'
                   : (reqMap[d.id] && reqMap[d.id].status==='approved'
                        ? dealMixHtml(reqMap[d.id].items)+'<button class="btn btn-block" data-orderpkg="'+d.id+'" style="margin-top:8px">Order Package</button>'
                        : '<button class="btn btn-block" data-'+(dealBuildable(d)?'startbuild':'reqdeal')+'="'+d.id+'" style="margin-top:8px">Request this package</button>'))
              : '<button class="btn btn-block" data-nav="#/login" style="margin-top:8px">Sign in to request</button>')
        +'</div>';
      }).join('')+'<div id="dealmsg"></div>';
      box.addEventListener('input', function(ev){
        var q=ev.target.closest && ev.target.closest('[data-qty]'); if(q) recalcBuild(q.getAttribute('data-deal'));
      });
      box.addEventListener('click', function(ev){
        var n=ev.target.closest && ev.target.closest('[data-nav]'); if(n){ go(n.getAttribute('data-nav')); return; }
        var op=ev.target.closest && ev.target.closest('[data-orderpkg]');
        if(op){
          var odid=op.getAttribute('data-orderpkg'), oreq=reqMap[odid];
          if(!oreq || !oreq.items || !oreq.items.length){ document.getElementById('dealmsg').innerHTML='<div class="msg err">This package has no items to order.</div>'; return; }
          op.disabled=true; op.textContent='Adding…';
          loadCatalogueData(function(products, err){
            if(err){ op.disabled=false; op.textContent='Order Package'; document.getElementById('dealmsg').innerHTML='<div class="msg err">Could not load products: '+esc(err.message)+'</div>'; return; }
            var missing=[];
            oreq.items.forEach(function(it){
              var fv=null, fp=null;
              products.forEach(function(p){ (p.product_variants||[]).forEach(function(v){ if(Number(v.size_kg)===Number(it.size_kg)){ fv=v; fp=p; } }); });
              if(fv){ addToCart(fv, fp, it.qty); } else { missing.push(it.size_kg); }
            });
            if(missing.length){ document.getElementById('dealmsg').innerHTML='<div class="msg err">Some sizes are no longer available ('+missing.join(', ')+' kg) — the rest were added to your cart.</div>'; }
            go('#/cart');
          });
          return;
        }
        var bstart=ev.target.closest && ev.target.closest('[data-startbuild]');
        if(bstart){ var bid=bstart.getAttribute('data-startbuild'), bd=active.filter(function(x){return x.id===bid;})[0]; if(bd) bstart.outerHTML=dealBuilderHtml(bd); return; }
        var sd=ev.target.closest && ev.target.closest('[data-submitdeal]');
        if(sd){
          var did=sd.getAttribute('data-submitdeal'), root=document.querySelector('[data-build="'+did+'"]');
          var qtys=root.querySelectorAll('[data-qty][data-deal="'+did+'"]'), items=[], total=0;
          for(var i=0;i<qtys.length;i++){ var kg=parseFloat(qtys[i].getAttribute('data-kg'))||0, q2=parseInt(qtys[i].value||0,10); if(q2>0){ items.push({size_kg:kg, qty:q2}); total+=kg*q2; } }
          sd.disabled=true; sd.textContent='Sending…';
          sb.rpc('request_deal', { p_deal_id: did, p_items: items, p_total_kg: total }).then(function(rr){
            if(rr.error){ sd.disabled=false; sd.textContent='Request this package'; document.getElementById('dealmsg').innerHTML='<div class="msg err">Could not send request: '+esc(rr.error.message)+'</div>'; return; }
            root.outerHTML='<div class="msg amber" style="margin-top:8px;text-align:center"><b>Pending — awaiting approval</b></div>';
          });
          return;
        }
        var rq=ev.target.closest && ev.target.closest('[data-reqdeal]'); if(!rq) return;
        rq.disabled=true; rq.textContent='Sending…';
        sb.rpc('request_deal', { p_deal_id: rq.getAttribute('data-reqdeal') }).then(function(rr){
          if(rr.error){ rq.disabled=false; rq.textContent='Request this package'; document.getElementById('dealmsg').innerHTML='<div class="msg err">Could not send request: '+esc(rr.error.message)+'</div>'; return; }
          rq.outerHTML='<div class="msg amber" style="margin-top:8px;text-align:center"><b>Pending — awaiting approval</b></div>';
        });
      });
      wireNav();
    }
    if(me.user){
      sb.from('deal_requests').select('deal_id,status,items,created_at').in('status',['pending','approved']).order('created_at',{ascending:false}).then(function(rr){
        var map={}; (rr.data||[]).forEach(function(x){ if(x.deal_id && !map[x.deal_id]) map[x.deal_id]={status:x.status, items:x.items||[]}; });
        draw(map);
      });
    } else { draw({}); }
  });
}

      var b=ev.target.closest('[data-nav]'); if(b){ go(b.getAttribute('data-nav')); return; }
      var q=ev.target.closest('[data-q]'); if(q){ sel.qty=Math.max(1, sel.qty+parseInt(q.getAttribute('data-q'),10)); viewProduct(id); return; }
      if(ev.target.id==='add'){ addToCart(v, p, sel.qty); go('#/cart'); }
    });
  });
}
function addToCart(v, p, qty){
  var line=cart.filter(function(l){return l.variant_id===v.id;})[0];
  if(line){ line.qty+=qty; } else { cart.push({variant_id:v.id, product_id:p.id, product_name:p.name, size_kg:v.size_kg, unit_price_cents:v.wholesale_price_cents, qty:qty}); }
  saveCart();
}

/* ---------- cart (distributor) ---------- */
function setCartQty(vid, d){ var l=cart.filter(function(x){return x.variant_id===vid;})[0]; if(!l)return; l.qty=Math.max(1,l.qty+d); saveCart(); viewCart(); }
function removeCartLine(vid){ cart=cart.filter(function(x){return x.variant_id!==vid;}); saveCart(); viewCart(); }
function viewCart(){
  if(!cart.length){ shell('<div class="h1">Your cart</div><div class="msg">Your cart is empty. <button class="btn btn-sm" data-nav="#/shop">Browse products</button></div>','cart'); wireNav(); return; }
  var rows=cart.map(function(l){ return '<tr><td><b>'+esc(l.product_name)+'</b><br><span class="muted">'+l.size_kg+' kg · wholesale</span></td>'
    +'<td>'+zar(l.unit_price_cents)+'</td>'
    +'<td><button class="btn btn-ghost btn-sm" data-cq="-1" data-vid="'+l.variant_id+'">−</button> '+l.qty+' <button class="btn btn-ghost btn-sm" data-cq="1" data-vid="'+l.variant_id+'">+</button></td>'
    +'<td><b>'+zar(l.unit_price_cents*l.qty)+'</b></td>'
    +'<td><button class="btn btn-ghost btn-sm" data-rm="'+l.variant_id+'">Remove</button></td></tr>'; }).join('');
  shell('<div class="h1">Your cart</div>'
    +'<div class="tablewrap"><table><thead><tr><th>Item</th><th>Unit</th><th>Qty</th><th>Line</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    +'<div class="card" style="max-width:340px;margin-left:auto;margin-top:12px">'
    +'<div class="sumrow"><span>Subtotal</span><b>'+zar(cartSubtotal())+'</b></div>'
    +'<div class="sumrow"><span>VAT (zero-rated)</span><b>'+zar(0)+'</b></div>'
    +'<button class="btn btn-block" data-nav="#/checkout" style="margin-top:8px">Checkout</button>'
    +'<p class="muted" style="text-align:center">+ delivery fee if delivered</p></div>','cart');
  var m=document.getElementById('main');
  m.addEventListener('click', function(ev){
    var q=ev.target.closest('[data-cq]'); if(q){ setCartQty(q.getAttribute('data-vid'), parseInt(q.getAttribute('data-cq'),10)); return; }
    var rm=ev.target.closest('[data-rm]'); if(rm){ removeCartLine(rm.getAttribute('data-rm')); return; }
    var n=ev.target.closest('[data-nav]'); if(n){ go(n.getAttribute('data-nav')); }
  });
}
function wireNav(){ Array.prototype.forEach.call(document.querySelectorAll('#main [data-nav]'), function(b){ b.addEventListener('click', function(){ go(b.getAttribute('data-nav')); }); }); }

/* ---------- checkout + place order (distributor) ---------- */
var myDistributor=null, settingsCache=null, depotsCache=null, checkoutState={fulfillment:'delivery',payment:'cash'};
function loadCheckoutRefs(cb){
  var done=0, need=3;
  function tick(){ done++; if(done>=need) cb(); }
  if(myDistributor){ tick(); } else sb.from('distributors').select('id,name,surname,phone,address1,address2,city,province').eq('profile_id',me.user.id).maybeSingle().then(function(r){ myDistributor=r.data||{}; tick(); });
  if(settingsCache){ tick(); } else sb.from('business_settings').select('bank_name,account_name,account_number,branch_code,default_delivery_fee_cents').maybeSingle().then(function(r){ settingsCache=r.data||{}; tick(); });
  if(depotsCache){ tick(); } else sb.from('depots').select('id,name,address').eq('is_active',true).order('name').then(function(r){ depotsCache=r.data||[]; tick(); });
}
function depInfo(depotId){
  var d=(depotsCache||[]).filter(function(x){return x.id===depotId;})[0];
  if(!d) return '';
  return '<div style="font-weight:600;margin-bottom:6px">Collection point:</div>'
    +'<div class="sumrow"><span class="muted">Depot</span><b>'+esc(d.name)+'</b></div>'
    +'<div class="sumrow"><span class="muted">Address</span><b style="text-align:right;max-width:65%">'+esc(d.address||'—')+'</b></div>';
}
function viewCheckout(){
  if(!cart.length){ go('#/cart'); return; }
  loadCheckoutRefs(function(){
    var f=checkoutState.fulfillment, pay=checkoutState.payment;
    var deliv=f==='delivery'?(settingsCache.default_delivery_fee_cents||0):0;
    var total=cartSubtotal()+deliv;
    var addr=[myDistributor.address1,myDistributor.address2,myDistributor.city,myDistributor.province].filter(Boolean).join('\n');
    var name=((myDistributor.name||'')+' '+(myDistributor.surname||'')).trim();
    var depotOpts=(depotsCache||[]).map(function(d){return '<option value="'+d.id+'">'+esc(d.name)+'</option>';}).join('')||'<option value="">(no depots configured)</option>';
    var s=settingsCache, hasBank=!!(s.bank_name);
    shell('<button class="btn btn-ghost btn-sm" data-nav="#/cart">‹ Back to cart</button><div class="h1" style="margin-top:8px">Checkout</div>'
      +'<form id="co"><div class="card"><b>Your details</b>'
        +'<p class="muted" style="margin:2px 0 4px">Name &amp; phone come from your account — <button type="button" data-nav="#/profile" class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:12px">Edit on Profile</button></p>'
        +'<label>Name</label><input name="name" value="'+esc(name)+'" readonly>'
        +'<label>Phone</label><input name="phone" value="'+esc(myDistributor.phone||'')+'" readonly>'
      +'</div>'
      +'<div class="card" style="margin-top:12px"><b>How would you like to receive it?</b>'
        +'<label class="radio"><span>🚚 <b>Delivery</b> — to your address</span><input type="radio" name="ff" value="delivery"'+(f==='delivery'?' checked':'')+'></label>'
        +'<div class="muted" style="margin:-2px 4px 10px">Delivery fee: <b>'+zar(settingsCache.default_delivery_fee_cents||0)+'</b></div>'
        +'<label class="radio"><span>🏬 <b>Collection</b> — pick up at a depot <span class="muted">(free)</span></span><input type="radio" name="ff" value="collection"'+(f==='collection'?' checked':'')+'></label>'
        +(f==='delivery'?'<label>Delivery address <span style="color:var(--red)">*</span></label><textarea name="address" rows="4" required placeholder="Street, suburb, city, postal code">'+esc(addr)+'</textarea>':'<label>Collect from</label><select name="depot">'+depotOpts+'</select><div id="depinfo" class="msg" style="text-align:left;margin-top:8px"></div>')
      +'</div>'
      +'<div class="card" style="margin-top:12px"><b>Payment</b>'
        +'<label class="radio"><span>💵 <b>Cash</b> — pay on '+(f==='collection'?'collection':'delivery')+'</span><input type="radio" name="pay" value="cash"'+(pay==='cash'?' checked':'')+'></label>'
        +'<label class="radio"><span>🏦 <b>Manual EFT</b> — bank transfer, upload proof</span><input type="radio" name="pay" value="eft"'+(pay==='eft'?' checked':'')+'></label>'
        +(pay==='eft'?(hasBank?'<div class="msg" style="text-align:left"><div style="font-weight:600;margin-bottom:6px">Pay by EFT to:</div><div class="sumrow"><span class="muted">Account name</span><b>'+esc(s.account_name||'—')+'</b></div><div class="sumrow"><span class="muted">Account number</span><b>'+esc(s.account_number||'—')+'</b></div><div class="sumrow"><span class="muted">Bank</span><b>'+esc(s.bank_name||'—')+'</b></div><div class="sumrow"><span class="muted">Branch</span><b>'+esc(s.branch_code||'—')+'</b></div><div class="sumrow"><span class="muted">Reference</span><b>your order number</b></div></div>':'<div class="msg amber">Bank details not yet configured — you can still order; we\'ll send details.</div>'):'')
      +'</div></form>'
      +'<div class="card" style="margin-top:12px"><b>Summary</b>'
        +cart.map(function(l){return '<div class="sumrow"><span>'+esc(l.product_name)+' '+l.size_kg+'kg × '+l.qty+'</span><b>'+zar(l.unit_price_cents*l.qty)+'</b></div>';}).join('')
        +'<div class="sumrow"><span>Delivery</span><b>'+zar(deliv)+'</b></div>'
        +'<div class="sumrow"><span>VAT (zero-rated)</span><b>'+zar(0)+'</b></div>'
        +'<div class="sumrow"><span><b>Total</b></span><b>'+zar(total)+'</b></div>'
        +'<button class="btn btn-block" id="place" style="margin-top:10px">Place order</button></div>','checkout');
    var m=document.getElementById('main');
    m.addEventListener('change', function(ev){ var t=ev.target;
      if(t.name==='ff'){ checkoutState.fulfillment=t.value; viewCheckout(); }
      if(t.name==='pay'){ checkoutState.payment=t.value; viewCheckout(); }
      if(t.name==='depot'){ var di=document.getElementById('depinfo'); if(di) di.innerHTML=depInfo(t.value); } });
    m.addEventListener('click', function(ev){ var n=ev.target.closest('[data-nav]'); if(n){ go(n.getAttribute('data-nav')); return; } if(ev.target.id==='place'){ placeOrder(); } });
    (function(){ var di=document.getElementById('depinfo'); if(di){ var dsel=document.querySelector('#co select[name="depot"]'); di.innerHTML=depInfo(dsel?dsel.value:''); } })();
  });
}
function placeOrder(){
  var btn=document.getElementById('place'); btn.disabled=true; btn.textContent='Placing…';
  var form=document.getElementById('co');
  var items=cart.map(function(l){ return {variant_id:l.variant_id, qty:l.qty}; });
  var f=checkoutState.fulfillment;
  var address=f==='delivery'?((form.address&&form.address.value)||'').trim():null;
  var depot=f==='collection'?(form.depot?form.depot.value:null):null;
  if(f==='delivery' && !address){ btn.disabled=false; btn.textContent='Place order'; if(form.address) form.address.focus(); alert('Please enter a delivery address before placing the order.'); return; }
  sb.rpc('place_order', { p_items:items, p_fulfillment:f, p_delivery_address:address, p_depot_id:depot||null, p_payment_method:checkoutState.payment, p_notes:null })
    .then(function(r){
      if(r.error){ btn.disabled=false; btn.textContent='Place order'; alert('Could not place order: '+r.error.message); return; }
      var row=Array.isArray(r.data)?r.data[0]:r.data;
      cart=[]; saveCart(); catalogueCache=null; // stock changed
      go('#/confirm/'+row.order_id);
    });
}

/* ---------- confirmation + EFT proof upload (distributor) ---------- */
function viewConfirm(orderId){
  shell('<div id="cf" class="muted">Loading…</div>','');
  sb.from('orders').select('id,order_number,status,payment_method,payment_status,fulfillment_type,delivery_address,depot_id,delivery_fee_cents,total_cents,order_items(product_name,size_kg,unit_price_cents,qty),payments(id,proof_url)').eq('id',orderId).maybeSingle()
    .then(function(r){
      var box=document.getElementById('cf');
      if(r.error||!r.data){ box.innerHTML='<div class="msg err">Order not found.</div>'; return; }
      var o=r.data, eftPending=(o.payment_method==='eft' && o.payment_status==='unpaid');
      var hasProof=(o.payments||[]).some(function(p){return p.proof_url;});
      box.innerHTML='<div class="card" style="max-width:560px;margin:0 auto">'
        +'<div class="h1">Order '+esc(o.order_number)+'</div><p class="sub">Status: <span class="pill">'+esc(titleCase(o.status))+'</span> · Payment: <span class="pill">'+esc(o.payment_status)+'</span></p>'
        +(o.payment_method==='cash'?'<div class="msg">💵 Please have <b>'+zar(o.total_cents)+'</b> ready to pay on '+(o.fulfillment_type==='collection'?'collection':'delivery')+'.</div>':'')
        +(eftPending?'<div class="msg">🏦 Pay <b>'+zar(o.total_cents)+'</b> by EFT using reference <b>'+esc(o.order_number)+'</b>, then upload your proof.'+(hasProof?'<br>✅ Proof uploaded — awaiting verification.':'<br><label>Upload proof of payment</label><input type="file" id="proof" accept="image/*,application/pdf"><button class="btn btn-sm" id="up" style="margin-top:6px">Upload</button>')+'</div>':'')
        +'<div class="card">'+(o.order_items||[]).map(function(i){return '<div class="sumrow"><span>'+esc(i.product_name)+' '+i.size_kg+'kg × '+i.qty+'</span><b>'+zar(i.unit_price_cents*i.qty)+'</b></div>';}).join('')
          +'<div class="sumrow"><span>Delivery</span><b>'+zar(o.delivery_fee_cents)+'</b></div><div class="sumrow"><span><b>Total</b></span><b>'+zar(o.total_cents)+'</b></div></div>'
        +'<button class="btn btn-block" data-nav="#/shop" style="margin-top:12px">Continue shopping</button></div>';
      var up=document.getElementById('up'); if(up){ up.addEventListener('click', function(){ var f=document.getElementById('proof').files[0]; if(!f){ alert('Choose a file'); return; } uploadProof(o.id, o.total_cents, o.order_number, f, up); }); }
      var cont=box.querySelector('[data-nav]'); if(cont){ cont.addEventListener('click', function(){ go('#/shop'); }); }
    });
}
function uploadProof(orderId, total, orderNumber, file, btn){
  btn.disabled=true; btn.textContent='Uploading…';
  var path=orderId+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  sb.storage.from('pop-uploads').upload(path, file).then(function(u){
    if(u.error){ btn.disabled=false; btn.textContent='Upload'; alert('Upload failed: '+u.error.message); return; }
    sb.from('payments').insert({ order_id:orderId, method:'eft', amount_cents:total, status:'pending', proof_url:path, reference:orderNumber }).then(function(p){
      if(p.error){ btn.disabled=false; btn.textContent='Upload'; alert('Saved file but could not record payment: '+p.error.message); return; }
      viewConfirm(orderId);
    });
  });
}

/* ---------- deals (admin) ---------- */
function viewAdminDeals(){
  shell('<div class="h1">Package deals</div><p class="sub">Add, edit or remove bulk deals shown to distributors &amp; guests. Changes save automatically.</p><div id="adeals" class="muted">Loading…</div>', 'admindeals');
  Promise.all([
    sb.from('deals').select('*').order('sort_order').order('title'),
    sb.from('deal_requests').select('id,deal_title,status,created_at,items,total_kg,distributors(name,surname)').order('created_at',{ascending:false}),
    sb.from('product_variants').select('size_kg')
  ]).then(function(res){
    var box=document.getElementById('adeals');
    var dr=res[0], rr=res[1];
    if(dr.error){ box.innerHTML='<div class="msg err">Could not load deals: '+esc(dr.error.message)+'</div>'; return; }
    var deals=dr.data||[], reqs=(rr&&rr.data)||[];
    var sizeRows=(res[2]&&res[2].data)||[], sizeSet={};
    sizeRows.forEach(function(x){ if(x.size_kg!=null) sizeSet[x.size_kg]=true; });
    var allSizes=Object.keys(sizeSet).map(Number).sort(function(a,b){return a-b;});
    var dealsHtml=deals.map(function(d){
      var sel=(d.allowed_sizes||[]).map(Number);
      var sizesHtml=allSizes.length
        ? '<div style="margin-bottom:6px">'+allSizes.map(function(s){ return '<label class="muted" style="white-space:nowrap;margin-right:14px"><input type="checkbox" data-dsize data-id="'+d.id+'" data-kg="'+s+'"'+(sel.indexOf(s)>-1?' checked':'')+' style="width:auto"> '+s+' kg</label>'; }).join('')+'</div>'
        : '<div class="muted" style="margin-bottom:6px">No sizes in the catalogue yet — add sizes in Products &amp; stock.</div>';
      return '<details class="card" style="margin-bottom:14px">'
        +'<summary style="cursor:pointer;font-weight:700">'+esc(d.title)+' <span class="muted" style="font-weight:400">· '+(d.is_active?'active':'draft')+(d.target_kg!=null?' · '+esc(String(d.target_kg))+' kg':' · no target')+'</span></summary>'
        +'<div style="margin-top:10px">'
        +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'
          +'<input type="text" data-df="title" data-id="'+d.id+'" value="'+esc(d.title)+'" style="font-weight:700;max-width:260px" placeholder="Deal title">'
          +'<label class="muted" style="white-space:nowrap"><input type="checkbox" data-active data-id="'+d.id+'"'+(d.is_active?' checked':'')+' style="width:auto"> active</label>'
          +'<div style="flex:1"></div>'
          +'<button class="btn btn-ghost btn-sm" data-deldeal="'+d.id+'" style="border-color:var(--red);color:var(--red)">Delete</button>'
        +'</div>'
        +'<div style="display:flex;gap:8px;flex-wrap:wrap"><div style="flex:1;min-width:120px"><label>Price</label><input type="text" data-df="price_text" data-id="'+d.id+'" value="'+esc(d.price_text||'')+'" placeholder="R 60 000"></div><div style="flex:1;min-width:120px"><label>Total</label><input type="text" data-df="total_text" data-id="'+d.id+'" value="'+esc(d.total_text||'')+'" placeholder="8 500 kg total"></div><div style="flex:1;min-width:120px"><label>Target (kg)</label><input type="number" min="0" step="0.5" data-dfnum="target_kg" data-id="'+d.id+'" value="'+(d.target_kg==null?'':esc(String(d.target_kg)))+'" placeholder="8500"></div></div>'
        +'<label>Included bag sizes</label>'+sizesHtml
        +'<label>Subtitle</label><input type="text" data-df="subtitle" data-id="'+d.id+'" value="'+esc(d.subtitle||'')+'">'
        +'<label>Description</label><textarea data-df="description" data-id="'+d.id+'" style="width:100%;min-height:96px;font-family:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px">'+esc(d.description||'')+'</textarea>'
        +'<label>Example combination <span class="muted">(one item per line)</span></label><textarea data-df="example" data-id="'+d.id+'" style="width:100%;min-height:96px;font-family:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px">'+esc(d.example||'')+'</textarea>'
        +'</div>'
      +'</details>';
    }).join('');
    var reqRows=reqs.map(function(q){
      var who=q.distributors?esc(((q.distributors.name||'')+' '+(q.distributors.surname||'')).trim()):'';
      var act=q.status==='pending'?'<button class="btn btn-sm" data-reqact="approve" data-id="'+q.id+'">Approve</button> <button class="btn btn-ghost btn-sm" data-reqact="decline" data-id="'+q.id+'">Decline</button>':'—';
      var mix=(q.items&&q.items.length)
        ? q.items.map(function(it){ return esc(kgFmt(it.size_kg))+' kg × '+esc(String(it.qty)); }).join('<br>')+(q.total_kg!=null?'<br><b>'+esc(kgFmt(q.total_kg))+' kg</b>':'')
        : '<span class="muted">—</span>';
      return '<tr><td>'+esc(q.deal_title||'')+'</td><td>'+mix+'</td><td>'+who+'</td><td>'+esc((q.created_at||'').slice(0,10))+'</td><td>'+distStatusPill(q.status)+'</td><td>'+act+'</td></tr>';
    }).join('')||'<tr><td colspan="6" class="muted">No requests yet.</td></tr>';
    box.innerHTML=dealsHtml
      +'<div class="card" style="max-width:560px"><b>Add a deal</b><label>Title</label><input type="text" id="ndtitle" placeholder="e.g. 5 Ton Starter Deal"><label>Price</label><input type="text" id="ndprice" placeholder="R 40 000"><button class="btn" id="ndadd" style="margin-top:10px">Add deal</button></div>'
      +'<div class="h1" style="font-size:18px;margin-top:20px">Requests</div>'
      +'<div class="tablewrap"><table><thead><tr><th>Deal</th><th>Package</th><th>Distributor</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody>'+reqRows+'</tbody></table></div>'
      +'<div id="admsg"></div>';
    function amsg(html){ var m=document.getElementById('admsg'); if(!m) return; m.innerHTML=html; if(html) setTimeout(function(){ if(m) m.innerHTML=''; }, 2500); }
    box.addEventListener('change', function(ev){
      var el=ev.target;
      if(el.getAttribute && el.getAttribute('data-df')){
        var f=el.getAttribute('data-df'), v=el.value;
        if(f==='title' && !(v||'').trim()){ amsg('<div class="msg err">Title cannot be empty.</div>'); viewAdminDeals(); return; }
        var patch={}; patch[f]=(f==='title'? v.trim() : ((v||'').trim()||null)); el.disabled=true;
        sb.from('deals').update(patch).eq('id', el.getAttribute('data-id')).then(function(r2){ el.disabled=false; dealsCache=null; amsg(r2.error?'<div class="msg err">Save failed: '+esc(r2.error.message)+'</div>':'<div class="msg ok">Saved ✓</div>'); });
        return;
      }
      if(el.getAttribute && el.getAttribute('data-dfnum')){
        var fn=el.getAttribute('data-dfnum'), raw=(el.value||'').trim();
        var num=raw===''?null:parseFloat(raw);
        if(raw!=='' && (isNaN(num)||num<0)){ amsg('<div class="msg err">Enter a valid number.</div>'); return; }
        var pn={}; pn[fn]=num; el.disabled=true;
        sb.from('deals').update(pn).eq('id', el.getAttribute('data-id')).then(function(r2){ el.disabled=false; dealsCache=null; amsg(r2.error?'<div class="msg err">Save failed: '+esc(r2.error.message)+'</div>':'<div class="msg ok">Saved ✓</div>'); });
        return;
      }
      if(el.hasAttribute && el.hasAttribute('data-dsize')){
        var did=el.getAttribute('data-id');
        var boxes=box.querySelectorAll('[data-dsize][data-id="'+did+'"]'), arr=[];
        for(var i=0;i<boxes.length;i++){ if(boxes[i].checked) arr.push(parseFloat(boxes[i].getAttribute('data-kg'))); }
        arr.sort(function(a,b){return a-b;});
        sb.from('deals').update({allowed_sizes:arr}).eq('id', did).then(function(r2){ dealsCache=null; amsg(r2.error?'<div class="msg err">Save failed: '+esc(r2.error.message)+'</div>':'<div class="msg ok">Saved ✓</div>'); });
        return;
      }
      if(el.hasAttribute && el.hasAttribute('data-active')){
        el.disabled=true;
        sb.from('deals').update({is_active:el.checked}).eq('id', el.getAttribute('data-id')).then(function(r2){ el.disabled=false; dealsCache=null; amsg(r2.error?'<div class="msg err">Save failed: '+esc(r2.error.message)+'</div>':'<div class="msg ok">Saved ✓</div>'); });
        return;
      }
    });
    box.addEventListener('click', function(ev){
      var del=ev.target.closest && ev.target.closest('[data-deldeal]');
      if(del){ if(!confirm('Delete this deal?')) return; sb.from('deals').delete().eq('id', del.getAttribute('data-deldeal')).then(function(r2){ if(r2.error){ amsg('<div class="msg err">Delete failed: '+esc(r2.error.message)+'</div>'); return; } dealsCache=null; viewAdminDeals(); }); return; }
      var ra=ev.target.closest && ev.target.closest('[data-reqact]');
      if(ra){ var st=ra.getAttribute('data-reqact')==='approve'?'approved':'declined'; sb.from('deal_requests').update({status:st}).eq('id', ra.getAttribute('data-id')).then(function(r2){ if(r2.error){ amsg('<div class="msg err">Update failed: '+esc(r2.error.message)+'</div>'); return; } viewAdminDeals(); }); return; }
      if(ev.target.id==='ndadd'){ var t=(document.getElementById('ndtitle').value||'').trim(), p=(document.getElementById('ndprice').value||'').trim(); if(!t){ amsg('<div class="msg err">Title is required.</div>'); return; } ev.target.disabled=true; sb.from('deals').insert({title:t, price_text:p||null, is_active:true}).then(function(r2){ ev.target.disabled=false; if(r2.error){ amsg('<div class="msg err">Add failed: '+esc(r2.error.message)+'</div>'); return; } dealsCache=null; viewAdminDeals(); }); return; }
    });
  });
}

      +'<label>Name</label><input type="text" id="ndname" placeholder="e.g. Piet Retief depot">'
      +'<label>Address</label><input type="text" id="ndaddr" placeholder="Street, town">'
      +'<button class="btn" id="ndadd" style="margin-top:10px">Add depot</button></div><div id="depmsg"></div>';
    function depMsg(html){ var m=document.getElementById('depmsg'); if(!m) return; m.innerHTML=html; if(html) setTimeout(function(){ if(m) m.innerHTML=''; }, 2500); }
    box.addEventListener('change', function(ev){
      var el=ev.target;
      if(el.getAttribute && el.getAttribute('data-f')){
        var v=(el.value||'').trim();
        if(!v){ depMsg('<div class="msg err">Name/address cannot be empty.</div>'); viewAdminDepots(); return; }
        var patch={}; patch[el.getAttribute('data-f')]=v; el.disabled=true;
        sb.from('depots').update(patch).eq('id', el.getAttribute('data-id')).then(function(rr){ el.disabled=false; depMsg(rr.error?'<div class="msg err">Save failed: '+esc(rr.error.message)+'</div>':'<div class="msg ok">Saved ✓</div>'); });
        return;
      }
      if(el.hasAttribute && el.hasAttribute('data-active')){
        el.disabled=true;
        sb.from('depots').update({is_active:el.checked}).eq('id', el.getAttribute('data-id')).then(function(rr){ el.disabled=false; depMsg(rr.error?'<div class="msg err">Save failed: '+esc(rr.error.message)+'</div>':'<div class="msg ok">Saved ✓</div>'); });
        return;
      }
    });
    box.addEventListener('click', function(ev){
      var del=ev.target.closest ? ev.target.closest('[data-del]') : null;
      if(del){ if(!confirm('Delete this depot? (If it is used by an existing order, deletion will be blocked — untick "active" instead.)')) return;
        sb.from('depots').delete().eq('id', del.getAttribute('data-del')).then(function(rr){ if(rr.error){ depMsg('<div class="msg err">Delete failed: '+esc(rr.error.message)+' — try unticking "active" instead.</div>'); return; } viewAdminDepots(); }); return; }
      if(ev.target.id==='ndadd'){
        var name=(document.getElementById('ndname').value||'').trim(), addr=(document.getElementById('ndaddr').value||'').trim();
        if(!name || !addr){ depMsg('<div class="msg err">Name and address are both required.</div>'); return; }
        ev.target.disabled=true;
        sb.from('depots').insert({name:name, address:addr, is_active:true}).then(function(rr){ ev.target.disabled=false; if(rr.error){ depMsg('<div class="msg err">Add failed: '+esc(rr.error.message)+'</div>'); return; } viewAdminDepots(); });
        return;
      }
    });
  });
}

/* ---------- distributors (admin) ---------- */
function distStatusPill(s){
  if(s==='approved') return '<span class="pill">Approved</span>';
  if(s==='pending') return '<span class="pill amber">Pending</span>';
  if(s==='suspended') return '<span class="pill red">Suspended</span>';
  return '<span class="pill red">'+esc(titleCase(s)||'—')+'</span>';
}
function distActions(d){
  if(d.status==='approved') return '<button class="btn btn-ghost btn-sm" data-act="suspend" data-id="'+d.id+'">Suspend</button>';
  if(d.status==='pending')  return '<button class="btn btn-sm" data-act="approve" data-id="'+d.id+'">Approve</button><button class="btn btn-ghost btn-sm" data-act="reject" data-id="'+d.id+'">Reject</button>';
  if(d.status==='suspended')return '<button class="btn btn-sm" data-act="approve" data-id="'+d.id+'">Re-activate</button>';
  return '<button class="btn btn-sm" data-act="approve" data-id="'+d.id+'">Approve</button>';
}

          pmsg('<div class="msg ok">Password changed ✓ — use it next time you sign in.</div>');
        });
      });
    });
}

var distFilter='approved', distSearch='', distPage=0;
function loadDistributors(){
  var admin=me.role==='admin';
  var addForm = admin ? '<details style="margin-bottom:14px"><summary style="cursor:pointer;font-weight:700;color:var(--green-dark)">+ Add a distributor</summary>'
    +'<div class="card" style="max-width:560px;margin-top:10px">'
      +'<p class="muted">Creates a login (<b>name.surname</b>) with the starter password <b>Suthisa2026</b> and an approved record. Share the login + password with the distributor; they can change the password on their Profile page.</p>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap"><div style="flex:1;min-width:140px"><label>Name *</label><input type="text" id="adname"></div><div style="flex:1;min-width:140px"><label>Surname *</label><input type="text" id="adsurname"></div></div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap"><div style="flex:1;min-width:140px"><label>Phone *</label><input type="text" id="adphone"></div><div style="flex:1;min-width:140px"><label>Alternate phone</label><input type="text" id="adalt"></div></div>'
      +'<label>Contact email</label><input type="text" id="ademail">'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap"><div style="flex:1;min-width:140px"><label>City</label><input type="text" id="adcity"></div><div style="flex:1;min-width:140px"><label>Province</label><input type="text" id="adprov"></div></div>'
      +'<button class="btn btn-block" id="adadd" type="button" style="margin-top:12px">Create distributor</button>'
    +'</div></details>' : '';
  shell('<div class="h1">Distributors</div><div id="distmsg"></div>'+addForm
    +(admin?'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">'
        +'<input type="text" id="distsearch" placeholder="Search name / surname" style="max-width:240px">'
        +'<select id="distfilter" style="width:auto"><option value="approved">Approved</option><option value="pending">Pending</option><option value="suspended">Suspended</option><option value="rejected">Rejected</option><option value="all">All</option></select>'
      +'</div>':'')
    +'<div id="disttable" class="muted">Loading…</div>','distributors');
  if(admin){
    var ssel=document.getElementById('distsearch'); if(ssel){ ssel.value=distSearch; ssel.addEventListener('input',function(){ distSearch=ssel.value; distPage=0; clearTimeout(ssel._t); ssel._t=setTimeout(loadDistTable,300); }); }
    var fsel=document.getElementById('distfilter'); if(fsel){ fsel.value=distFilter; fsel.addEventListener('change',function(){ distFilter=fsel.value; distPage=0; loadDistTable(); }); }
    var ab=document.getElementById('adadd'); if(ab) ab.addEventListener('click', function(){
      var name=(document.getElementById('adname').value||'').trim(), surname=(document.getElementById('adsurname').value||'').trim(), phone=(document.getElementById('adphone').value||'').trim();
      var dm=document.getElementById('distmsg');
      if(!name || !surname || !phone){ dm.innerHTML='<div class="msg err">Name, surname and phone are required.</div>'; return; }
      var body={ name:name, surname:surname, phone:phone,
        alternatephone:(document.getElementById('adalt').value||'').trim(), email:(document.getElementById('ademail').value||'').trim(),
        city:(document.getElementById('adcity').value||'').trim(), province:(document.getElementById('adprov').value||'').trim() };
      ab.disabled=true; ab.textContent='Creating…';
      sb.functions.invoke('admin-add-distributor', { body: body }).then(function(res){
        ab.disabled=false; ab.textContent='Create distributor';
        if(res.error){ dm.innerHTML='<div class="msg err">Add-distributor service error: '+esc(res.error.message||'')+'</div>'; return; }
        if(res.data && res.data.error){ dm.innerHTML='<div class="msg err">Could not add: '+esc(res.data.error)+'</div>'; return; }
        dm.innerHTML='<div class="msg ok">Created login <b>'+esc(res.data.login_name)+'</b> · password <b>'+esc(res.data.password)+'</b> — share these with the distributor.</div>';
        distFilter='approved'; distPage=0; if(fsel) fsel.value='approved'; loadDistTable();
      });
    });
    var tbl=document.getElementById('disttable');
    tbl.addEventListener('click', function(ev){
      var pg=ev.target.closest && ev.target.closest('[data-pg]');
      if(pg){ if(pg.getAttribute('data-pg')==='prev'&&distPage>0) distPage--; else if(pg.getAttribute('data-pg')==='next') distPage++; loadDistTable(); return; }
      var el=ev.target.closest ? ev.target.closest('[data-act]') : null; if(!el) return;
      var act=el.getAttribute('data-act'), id=el.getAttribute('data-id');
      var status = act==='approve'?'approved' : act==='suspend'?'suspended' : act==='reject'?'rejected' : null;
      if(!status) return;
      var patch={status:status}; if(status==='approved'){ patch.approved_at=new Date().toISOString(); patch.approved_by=me.user.id; }
      el.disabled=true;
      sb.from('distributors').update(patch).eq('id', id).then(function(rr){
        if(rr.error){ el.disabled=false; document.getElementById('distmsg').innerHTML='<div class="msg err">Update failed: '+esc(rr.error.message)+'</div>'; return; }
        loadDistTable();
      });
    });
  }
  loadDistTable();
}
function loadDistTable(){
  var admin=me.role==='admin';
  var box=document.getElementById('disttable'); if(!box) return;
  var term=distSearch.trim().replace(/[,()*%]/g,'');
  var q=sb.from('distributors').select('id,name,surname,login_name,phone,alternatephone,city,province,status',{count:'exact'});
  if(distFilter!=='all') q=q.eq('status', distFilter);
  if(term) q=q.or('name.ilike.*'+term+'*,surname.ilike.*'+term+'*');
  q.order('name').range(distPage*10, distPage*10+9).then(function(r){
    if(r.error){ box.innerHTML='<div class="msg err">Could not load distributors: '+esc(r.error.message)+'</div>'; return; }
    var ds=r.data||[], count=r.count||0, pages=Math.max(1,Math.ceil(count/10));
    if(distPage>0 && distPage>=pages){ distPage=pages-1; return loadDistTable(); }
    var rows=ds.map(function(d){
      var full=esc(((d.name||'')+' '+(d.surname||'')).trim());
      var loc=[d.city,d.province].filter(Boolean).map(esc).join(', ');
      var phone=esc(d.phone||'')+(d.alternatephone?'<div class="muted">'+esc(d.alternatephone)+'</div>':'');
      return '<tr><td><b>'+full+'</b><div class="muted">'+esc(d.login_name||'')+'</div></td>'
        +'<td>'+phone+'</td><td>'+loc+'</td><td>'+distStatusPill(d.status)+'</td>'
        +(admin?'<td class="actions">'+distActions(d)+'</td>':'')+'</tr>';
    }).join('')||'<tr><td colspan="'+(admin?5:4)+'" class="muted">No distributors match.</td></tr>';
    var pager = pages>1 ? '<div style="display:flex;justify-content:center;align-items:center;gap:12px;margin-top:10px"><button class="btn btn-ghost btn-sm" data-pg="prev"'+(distPage<=0?' disabled':'')+'>‹ Prev</button><span class="muted">Page '+(distPage+1)+' of '+pages+'</span><button class="btn btn-ghost btn-sm" data-pg="next"'+(distPage>=pages-1?' disabled':'')+'>Next ›</button></div>' : '';
    box.innerHTML='<p class="muted">'+count+' '+(distFilter==='all'?'':titleCase(distFilter)+' ')+'distributor'+(count===1?'':'s')+'.</p>'
      +'<div class="tablewrap"><table><thead><tr><th>Name / login</th><th>Phone</th><th>Location</th><th>Status</th>'+(admin?'<th>Actions</th>':'')+'</tr></thead><tbody>'+rows+'</tbody></table></div>'+pager;
  });
}
})();
</script>
</body>
</html>
