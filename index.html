<style>
:root{
  --green:#008000;--green-dark:#006400;--green-soft:#E0EFE0;--yellow:#FFFF00;--yellow-soft:#FFFFE0;
  --ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--bg:#f5f7f5;--white:#fff;
  --amber:#b7791f;--amber-bg:#fdf3d7;--blue:#1d4ed8;--blue-bg:#e0e8ff;--purple:#6d28d9;--purple-bg:#ede4ff;--red:#b91c1c;--red-bg:#fde3e3;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
a{color:var(--green);text-decoration:none}
button{font:inherit;cursor:pointer}
img{max-width:100%}

/* demo ribbon */

/* header */
header.top{background:#008000;color:#fff;position:sticky;top:0;z-index:30;border-bottom:4px solid var(--yellow)}
.top .row{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:1px;font-size:18px;color:#fff}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--yellow);color:var(--green-dark);display:grid;place-items:center;font-size:18px}
.brand small{display:block;font-weight:500;font-size:10px;letter-spacing:2px;opacity:.85;text-transform:uppercase}
.spacer{flex:1}
.persona{display:flex;align-items:center;gap:6px;font-size:13px}
.persona select{padding:6px 8px;border-radius:8px;border:0;font-size:13px;background:#fff;color:var(--ink)}
.cartbtn{position:relative;background:var(--yellow);color:var(--green-dark);border:0;border-radius:8px;padding:8px 12px;font-weight:700}
.cartbtn .badge{position:absolute;top:-8px;right:-8px;background:#b91c1c;color:#fff;border-radius:20px;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
nav.main{max-width:1080px;margin:0 auto;display:flex;gap:4px;padding:0 8px 8px;overflow-x:auto}
nav.main button{white-space:nowrap;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:20px;padding:7px 14px;font-size:14px}
nav.main button.active{background:#fff;color:var(--green-dark);font-weight:700}

main{max-width:1080px;margin:0 auto;padding:16px 14px 90px}

/* generic */
.h1{font-size:22px;font-weight:800;color:var(--green-dark);margin:6px 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:14px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;font-size:15px}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-dark)}
.btn-yellow{background:var(--yellow);color:var(--green-dark)}
.btn-ghost{background:#fff;color:var(--green-dark);border:1.5px solid var(--green)}
.btn-sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn-block{display:block;width:100%;text-align:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--green);font-weight:600;padding:0}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px}
.pill.green{background:var(--green-soft);color:var(--green-dark)}
.pill.yellow{background:var(--yellow-soft);color:var(--amber)}
.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.blue{background:var(--blue-bg);color:var(--blue)}
.pill.purple{background:var(--purple-bg);color:var(--purple)}
.pill.red{background:var(--red-bg);color:var(--red)}
.tag-whole{background:var(--yellow);color:var(--green-dark);font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px}

/* product grid */
.products{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.product{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pimg{height:130px;background:linear-gradient(135deg,var(--green-soft),var(--yellow-soft));display:grid;place-items:center;font-size:54px}
.pimg img{max-width:84px;max-height:96px;object-fit:contain;display:block}
.pimg:has(img){background:#fff}
.pbody{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.pname{font-weight:700}
.pcat{font-size:12px;color:var(--muted)}
.pprice{font-size:18px;font-weight:800;color:var(--green-dark)}
.pprice .was{font-size:13px;color:var(--muted);text-decoration:line-through;font-weight:500;margin-left:6px}
.psize{font-size:12px;color:var(--muted)}

/* detail */
.detail{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.detail .pimg{height:200px;border-radius:14px;font-size:120px}
.detail .pimg img{max-width:150px;max-height:150px}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.sizes button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:700}
.sizes button.active{border-color:var(--green);background:var(--green-soft);color:var(--green-dark)}
.sizes button:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{background:#f3f4f6;border:0;width:40px;height:42px;font-size:20px}
.qty span{min-width:44px;text-align:center;font-weight:700}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px;background:#fff}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--green);color:#fff;font-weight:600}
tbody tr:nth-child(even){background:#f7faf8}
td input{width:92px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:14px;vertical-align:middle}
td input.stock{width:70px}
td .pill{vertical-align:middle;margin-left:4px}

/* forms */
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=password],select,textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit}
textarea{min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.radio{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}
.radio.sel{border-color:var(--green);background:var(--green-soft)}
.radio input{margin-top:3px}
.radio .t{font-weight:700}
.radio .d{font-size:13px;color:var(--muted)}

/* summary */
.sumrow{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.sumrow.total{font-size:19px;font-weight:800;color:var(--green-dark);border-top:2px solid var(--line);margin-top:6px;padding-top:10px}
.note{background:var(--yellow-soft);border-left:4px solid var(--yellow);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px;margin:10px 0}
.bank{background:var(--green-soft);border-radius:10px;padding:12px 14px;font-size:14px}
.bank div{display:flex;justify-content:space-between;padding:3px 0}
.bank b{font-variant-numeric:tabular-nums}

/* dashboard */
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.stat .n{font-size:26px;font-weight:800;color:var(--green-dark)}
.stat .l{font-size:13px;color:var(--muted)}
.stat.alert .n{color:var(--amber)}
.bar{display:grid;grid-template-columns:130px 1fr 90px;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.bar .track{background:#eef2ef;border-radius:20px;height:16px;overflow:hidden}
.bar .fill{height:100%;background:var(--green);border-radius:20px}

.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .big{font-size:50px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:#111827;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:22px;max-width:340px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal-box h3{margin:0 0 4px;color:var(--green-dark)}
.modal-box .hint{font-size:12px;color:var(--muted);margin:0 0 12px}
.modal-box input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;margin-bottom:8px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.crumb{background:none;border:0;color:var(--muted);padding:0;margin-bottom:8px;font-size:14px}
.footer{max-width:1080px;margin:20px auto 0;padding:16px 14px;color:var(--muted);font-size:12px;text-align:center}

@media(max-width:760px){
  .detail{grid-template-columns:1fr}
  .detail .pimg{height:200px;font-size:90px}
  .row2{grid-template-columns:1fr}
  .brand small{display:none}
}
.logo-img{height:44px;width:auto;display:block}
.pwwrap{position:relative;margin-bottom:8px}.pwwrap input{padding-right:42px;margin-bottom:0}
.pwtoggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:17px;line-height:1;cursor:pointer;padding:4px;opacity:.7}
.pwtoggle:hover{opacity:1}
</style>
</head>
<body>

var KEY='suthisa-demo-v6', state, session={personaName:'Guest'}, cart=[];  // FROZEN — do NOT bump on future updates; bumping re-seeds and wipes saved data. Data now persists across site updates; the footer "Reset demo data" reseeds on demand.
function load(){

  try{session.personaName=LS.getItem(KEY+'-persona')||'Guest';}catch(e){session.personaName='Guest';}
  if(AUTH[session.personaName] && !authed[session.personaName]) session.personaName='Guest';  // protected personas must log in each session
  if(!state.dealRequests) state.dealRequests=[];  // safety for older cached state

  if(!state.settings.adminName) state.settings.adminName='Admin';  // admin login name (full name)
  if(!state.settings.stockPassword) state.settings.stockPassword='stock123';  // stock-admin password
  if(!state.settings.stockName) state.settings.stockName='Stock';  // stock-admin login name
}

function openLogin(name){pendingPersona=name;$('#loginTitle').textContent='Log in as '+name;var em=$('#loginEmail'),pw=$('#loginPw');pw.value='';em.value='';$('#loginHint').textContent='';
  if(name==='Approved distributor'){em.style.display='';em.placeholder='Login email';}

function doLogin(){var pw=$('#loginPw').value;

  if(target==='Approved distributor'){var email=($('#loginEmail').value||'').trim();if(!email){toast('Please enter your distributor email');return;}var d=state.distributors.filter(function(x){return (x.email||'').toLowerCase()===email.toLowerCase()&&x.status==='approved';})[0];session.distEmail=email;session.distName=d?((d.name||'')+' '+(d.surname||'')).trim():email;label=session.distName;}
  else if(target==='Admin'||target==='Stock admin'){var an=($('#loginEmail').value||'').trim();if(!an){toast('Please enter your login name');return;}if(an.toLowerCase()!==(loginNameFor(target)||'').toLowerCase()){toast('Incorrect login name');return;}label=loginNameFor(target);}
  authed[target]=true;pendingPersona=null;$('#loginModal').classList.remove('show');session.personaName=target;save();
  if(persona().role==='admin')go(isStockOnly()?'#/admin/products':'#/admin/dashboard');else go('#/shop');render();toast('Logged in as '+label);}

/* ---------- lookups ---------- */
function findProduct(id){return state.products.filter(function(p){return p.id===id;})[0];}
function findVariant(id){for(var i=0;i<state.products.length;i++){var vs=state.products[i].variants;for(var j=0;j<vs.length;j++)if(vs[j].id===id)return {p:state.products[i],v:vs[j]};}return null;}
function cartCount(){return cart.reduce(function(a,l){return a+l.qty;},0);}
function cartLines(){return cart.map(function(l){var fv=findVariant(l.vid);if(!fv)return null;return {vid:l.vid,qty:l.qty,p:fv.p,v:fv.v,unit:priceOf(fv.v)};}).filter(Boolean);}
function cartSubtotal(){return cartLines().reduce(function(a,l){return a+l.unit*l.qty;},0);}
function orderTotal(o){var s=o.items.reduce(function(a,i){return a+i.unit*i.qty;},0);return s+(o.delivery||0);}

/* ---------- routing ---------- */
function go(hash){location.hash=hash;}
function parse(){var h=location.hash||'#/shop';var m=h.replace(/^#\//,'').split('/');return {view:m[0]||'shop',id:m[1]||'',sub:m[2]||''};}

function render(){
  var r=parse(), a=$('#app');
  var p=persona();
  // stock-taker admin is locked to their single page — bounce any other route back
  if(isStockOnly() && !(r.view==='admin' && (r.id||'dashboard')==='products')){location.hash='#/admin/products';return;}
  // guard: non-admin trying admin routes
  if(r.view==='admin' && p.role!=='admin'){a.innerHTML=guardAdmin();buildNav();syncHeader();return;}
  var html='';
  switch(r.view){
    case 'shop':html=viewShop();break;
    case 'deals':html=viewDeals();break;
    case 'product':html=viewProduct(r.id);break;
    case 'cart':html=viewCart();break;
    case 'checkout':html=viewCheckout();break;
    case 'confirm':html=viewConfirm(r.id);break;
    case 'distributor':html=viewDistributor();break;
    case 'admin':html=viewAdmin(r.id||'dashboard');break;
    default:html=viewShop();
  }
  a.innerHTML=html;
  buildNav();syncHeader();window.scrollTo(0,0);
}

/* ---------- header / nav ---------- */
function syncHeader(){
  $('#cartbadge').textContent=cartCount();
  var admin=persona().role==='admin';
  $('#cartbtn').style.display=(session.personaName==='Approved distributor')?'':'none';  // cart only for approved distributors
  var sel=$('#persona');
  if(sel.options.length===0){Object.keys(PERSONAS).forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=k;sel.appendChild(o);});}
  sel.value=session.personaName;
  // once logged in (a protected persona), hide the role switcher and show a Log out button instead
  var li=!!AUTH[session.personaName];
  $('#personaBox').style.display=li?'none':'';
  $('#sessionBox').style.display=li?'':'none';
  if(li){
    var lbl=session.personaName==='Admin'?(loginNameFor('Admin')+' · Admin')
      :session.personaName==='Stock admin'?(loginNameFor('Stock admin')+' · Stock')
      :('Distributor'+(session.distName?' · '+session.distName:''));
    $('#whoami').textContent='Signed in: '+lbl;
  }
}
function buildNav(){
  var admin=persona().role==='admin', r=parse(), items;
  if(admin){items=persona().stockOnly?[['#/admin/products','Products & stock','products']]:[['#/admin/dashboard','Dashboard','dashboard'],['#/admin/products','Products & stock','products'],['#/admin/orders','Orders','orders'],['#/admin/approvals','Distributors','approvals'],['#/admin/requests','Requests','requests'],['#/admin/settings','Settings','settings']];}
  else{var pn=session.personaName;items=[['#/shop','Shop','shop']];
    if(pn!=='Retail customer') items.push(['#/deals','Package deals','deals']);            // deals hidden for customers
    if(pn==='Approved distributor') items.push(['#/cart','Cart','cart']);                   // cart only for approved distributors
    if(pn==='Guest'||pn==='Retail customer') items.push(['#/distributor','Become a distributor','distributor']);  // only guests/customers
  }
  $('#nav').innerHTML=items.map(function(it){
    var active=(admin&&r.view==='admin'&&(r.id||'dashboard')===it[2])||(!admin&&r.view===it[2]);
    return '<button data-act="go" data-view="'+it[0]+'" class="'+(active?'active':'')+'">'+it[1]+'</button>';
  }).join('');
}

function guardAdmin(){return '<div class="empty"><div class="big">🔒</div><p>The admin console requires the <b>Admin</b> persona.</p><button class="btn btn-primary" data-act="beadmin">Switch to Admin</button></div>';}

function viewAdmin(sub){
  if(isStockOnly())return adminProducts();  // stock-taker admin: stock page only
  if(sub==='products')return adminProducts();
  if(sub==='orders')return adminOrders();
  if(sub==='approvals')return adminApprovals();
  if(sub==='requests')return adminRequests();
  if(sub==='settings')return adminSettings();
  return adminDashboard();
}
function revenueStatuses(){return ['paid','preparing','ready','out_for_delivery','completed'];}
function adminDashboard(){
  var rev=state.orders.filter(function(o){return revenueStatuses().indexOf(o.status)>=0;}).reduce(function(a,o){return a+orderTotal(o);},0);
  var pendingEft=state.orders.filter(function(o){return o.payment==='eft'&&o.status==='pending';}).length;
  var openOrders=state.orders.filter(function(o){return ['pending','paid','preparing','ready','out_for_delivery'].indexOf(o.status)>=0;}).length;
  var pendDist=state.distributors.filter(function(d){return d.status==='pending';}).length;
  var pendReq=state.dealRequests.filter(function(r){return r.status==='pending';}).length;
  var low=[];state.products.forEach(function(p){p.variants.forEach(function(v){if(v.stock<=state.settings.lowStock)low.push({p:p,v:v});});});
  // revenue by product
  var byProd={};state.orders.filter(function(o){return revenueStatuses().indexOf(o.status)>=0;}).forEach(function(o){o.items.forEach(function(i){byProd[i.name]=(byProd[i.name]||0)+i.unit*i.qty;});});
  var names=Object.keys(byProd);var max=Math.max.apply(null,names.map(function(n){return byProd[n];}).concat([1]));
  var bars=names.map(function(n){return '<div class="bar"><span>'+esc(n)+'</span><div class="track"><div class="fill" style="width:'+Math.round(byProd[n]/max*100)+'%"></div></div><b style="text-align:right">'+zar(byProd[n])+'</b></div>';}).join('')||'<p class="sub">No sales yet.</p>';
  var lowRows=low.length?low.map(function(x){return '<tr><td>'+esc(x.p.name)+'</td><td>'+x.v.kg+' kg</td><td><span class="pill '+(x.v.stock<=0?'red':'amber')+'">'+x.v.stock+' left</span></td></tr>';}).join('')
    :'<tr><td colspan="3" class="sub" style="padding:14px">All stock levels healthy 👍</td></tr>';
  return '<div class="h1">Dashboard</div><p class="sub">Live overview · Suthisa Foods (demo data)</p>'
    +'<div class="grid stats">'
    +'<div class="stat"><div class="n">'+zar(rev)+'</div><div class="l">Revenue (paid orders)</div></div>'
    +'<div class="stat"><div class="n">'+openOrders+'</div><div class="l">Open orders</div></div>'
    +'<div class="stat '+(pendingEft?'alert':'')+'"><div class="n">'+pendingEft+'</div><div class="l">EFT payments to verify</div></div>'
    +'<div class="stat '+(pendDist?'alert':'')+'"><div class="n">'+pendDist+'</div><div class="l">Distributors to approve</div></div>'
    +'<div class="stat '+(pendReq?'alert':'')+'"><div class="n">'+pendReq+'</div><div class="l">Package requests</div></div>'
    +'<div class="stat '+(low.length?'alert':'')+'"><div class="n">'+low.length+'</div><div class="l">Low-stock items</div></div>'
    +'</div>'
    +'<div class="detail" style="grid-template-columns:1.2fr .8fr;margin-top:16px">'
    +'<div class="card"><b>Revenue by product</b><div style="margin-top:10px">'+bars+'</div></div>'
    +'<div class="card"><b>Low-stock alerts</b><div class="tablewrap" style="margin-top:8px;border:0"><table style="min-width:0"><thead><tr><th>Product</th><th>Size</th><th>Stock</th></tr></thead><tbody>'+lowRows+'</tbody></table></div></div>'
    +'</div>';
}
function adminProducts(){
  var totalVal=0;state.products.forEach(function(p){p.variants.forEach(function(v){totalVal+=v.wholesale*v.stock;});});
  var onlyOne=state.products.length<=1;  // can't delete the last product
  var so=isStockOnly();  // stock-taker admin: stock only (no price/structural edits)
  var cards=state.products.map(function(p){
    var rows=p.variants.map(function(v){
      var lowPill=(v.stock<=state.settings.lowStock?'<span class="pill '+(v.stock<=0?'red':'amber')+'">low</span>':'');
      var stockCell='<input type="number" min="0" class="stock" data-act="editstock" data-vid="'+v.id+'" value="'+v.stock+'"> '+lowPill;
      if(so) return '<tr><td>'+v.kg+' kg</td><td>'+stockCell+'</td></tr>';  // stock admin: size (read-only) + stock only
      return '<tr>'
        +'<td><input type="number" min="10" max="80" step="0.5" class="stock" data-act="editsize" data-vid="'+v.id+'" value="'+v.kg+'"> kg</td>'
        +'<td>R <input type="number" min="0" step="0.01" data-act="editprice" data-vid="'+v.id+'" data-tier="wholesale" value="'+(v.wholesale/100).toFixed(2)+'"></td>'
        +'<td>R <input type="number" min="0" step="0.01" data-act="editprice" data-vid="'+v.id+'" data-tier="retail" value="'+(v.retail/100).toFixed(2)+'"></td>'
        +'<td>'+stockCell+'</td>'
        +'<td><b>'+zar(v.wholesale*v.stock)+'</b></td>'
        +'<td><button class="link" data-act="delvariant" data-vid="'+v.id+'" style="color:var(--red)">Remove</button></td>'
        +'</tr>';
    }).join('')||'<tr><td colspan="'+(so?2:6)+'" class="psize">No sizes yet'+(so?'.':' — add one below.')+'</td></tr>';
    return '<div class="card" style="margin-bottom:14px">'
      +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
        +'<input type="text" data-act="editname" data-id="'+p.id+'" value="'+esc(p.name)+'"'+(so?' disabled':'')+' style="font-weight:700;max-width:230px">'
        +'<input type="text" data-act="editcat" data-id="'+p.id+'" value="'+esc(p.cat)+'"'+(so?' disabled':'')+' style="max-width:150px">'
        +'<div style="flex:1"></div>'
        +(so?'':'<button class="btn btn-ghost btn-sm" data-act="delproduct" data-id="'+p.id+'"'+(onlyOne?' disabled title="At least one product is required"':'')+' style="border-color:var(--red);color:var(--red)">Delete product</button>')
      +'</div>'
      +'<div class="tablewrap" style="margin-top:10px"><table><thead><tr>'+(so?'<th>Size (kg)</th><th>Stock</th>':'<th>Size (kg)</th><th>Wholesale</th><th>Retail</th><th>Stock</th><th>Value (wholesale)</th><th></th>')+'</tr></thead><tbody>'+rows+'</tbody></table></div>'
      +(so?'':'<button class="btn btn-yellow btn-sm" data-act="addsize" data-id="'+p.id+'" style="margin-top:10px">+ Add size</button>')
      +'</div>';
  }).join('');
  return '<div class="h1">Products &amp; stock</div><p class="sub">'+(so?'Stock-taking — update the <b>stock</b> quantity for each size.':'Add or remove products, edit sizes, prices (Rands) and stock. Changes save automatically.')+'</p>'
    +cards
    +(so?'':'<div class="card" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><b>Total stock value (wholesale)</b><span class="pprice">'+zar(totalVal)+'</span></div>')
    +(so?'':'<details class="card"><summary style="font-weight:700;cursor:pointer">➕ Add a new product</summary>'
    +'<form id="addProd"><div class="row2"><div><label>Product name</label><input type="text" name="name" required placeholder="e.g. Special Maize Meal"></div><div><label>Category</label><input type="text" name="cat" value="Maize Meal"></div></div>'
    +'<div class="row2"><div><label>First size (kg)</label><input type="number" name="kg" value="10" min="10" max="80" step="0.5"></div><div><label>Stock</label><input type="number" name="stock" value="50" min="0"></div></div>'
    +'<div class="row2"><div><label>Retail price (R)</label><input type="number" name="retail" value="99.99" step="0.01"></div><div><label>Wholesale price (R)</label><input type="number" name="wholesale" value="85.00" step="0.01"></div></div>'
    +'<button class="btn btn-primary" style="margin-top:12px" data-act="addprod">Add product</button></form></details>');
}
function adminApprovals(){
  function pill(s){return s==='pending'?'<span class="pill amber">Pending</span>':s==='approved'?'<span class="pill green">Approved</span>':s==='suspended'?'<span class="pill red">Suspended</span>':'<span class="pill red">Rejected</span>';}
  var rows=state.distributors.map(function(d){
    var a;
    if(d.status==='pending') a='<button class="btn btn-primary btn-sm" data-act="approve" data-id="'+d.id+'">Approve</button> <button class="btn btn-ghost btn-sm" data-act="reject" data-id="'+d.id+'">Reject</button>';
    else if(d.status==='approved') a='<button class="btn btn-ghost btn-sm" data-act="suspend" data-id="'+d.id+'">Suspend</button>';
    else if(d.status==='suspended') a='<button class="btn btn-primary btn-sm" data-act="approve" data-id="'+d.id+'">Re-activate</button> <button class="btn btn-ghost btn-sm" data-act="reject" data-id="'+d.id+'">Reject</button>';
    else a='<button class="btn btn-primary btn-sm" data-act="approve" data-id="'+d.id+'">Approve</button>';
    return '<tr><td><b>'+esc(d.name)+' '+esc(d.surname||'')+'</b></td><td>'+esc(d.phone)+(d.alternatephone?' / '+esc(d.alternatephone):'')+'<br><span class="psize">'+esc(d.email)+'</span></td><td>'+esc([d.city,d.province].filter(Boolean).join(', '))+'</td><td>'+pill(d.status)+'</td><td>'+a+'</td></tr>';
  }).join('')||'<tr><td colspan="5" class="psize" style="padding:14px">No distributors yet. Add an approved distributor below, or approve applications submitted via “Become a distributor”.</td></tr>';
  return '<div class="h1">Distributors</div><p class="sub">Approve applications and manage who can order. Only <b>approved</b> distributors can place orders.</p>'
    +'<div class="tablewrap"><table><thead><tr><th>Name</th><th>Contact</th><th>Location</th><th>Status</th><th>Action</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    +'<details class="card" style="margin-top:14px"><summary style="font-weight:700;cursor:pointer">➕ Add an approved distributor</summary>'
    +'<form id="distAddForm"><div class="row2"><div><label>Name</label><input type="text" name="name" required></div><div><label>Surname</label><input type="text" name="surname" required></div></div>'
    +'<div class="row2"><div><label>Phone</label><input type="tel" name="phone" required></div><div><label>Alternate phone</label><input type="tel" name="alternatephone"></div></div>'
    +'<label>Email</label><input type="email" name="email" required>'
    +'<div class="row2"><div><label>Address line 1</label><input type="text" name="address1"></div><div><label>Address line 2</label><input type="text" name="address2"></div></div>'
    +'<div class="row2"><div><label>City</label><input type="text" name="city"></div><div><label>Province</label><input type="text" name="province"></div></div>'
    +'<button class="btn btn-primary" style="margin-top:12px" data-act="adddist">Add approved distributor</button></form></details>';
}
function adminRequests(){
  var rows=state.dealRequests.slice().reverse().map(function(rq){
    var pillc=rq.status==='pending'?'amber':(rq.status==='approved'?'green':'red');
    var a=rq.status==='pending'?'<button class="btn btn-primary btn-sm" data-act="approve-request" data-id="'+rq.id+'">Approve</button> <button class="btn btn-ghost btn-sm" data-act="decline-request" data-id="'+rq.id+'">Decline</button>':'—';
    return '<tr><td><b>'+esc(rq.business)+'</b><br><span class="psize">'+rq.when+'</span></td><td>'+esc(rq.pkg)+'</td><td>'+esc(rq.price)+'</td><td><span class="pill '+pillc+'">'+rq.status+'</span></td><td>'+a+'</td></tr>';
  }).join('');
  return '<div class="h1">Package-deal requests</div><p class="sub">Bulk package requests from approved distributors, awaiting your approval.</p>'
    +(state.dealRequests.length?'<div class="tablewrap"><table><thead><tr><th>From</th><th>Package</th><th>Price</th><th>Status</th><th>Action</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="empty"><div class="big">📨</div><p>No package-deal requests yet.</p></div>');
}
function adminOrders(){
  var rows=state.orders.slice().reverse().map(function(o){
    var st=STATUS[o.status];
    var opts=nextStatuses(o).map(function(s){return '<option value="'+s+'">→ '+STATUS[s].label+'</option>';}).join('');
    var setter=opts?'<select data-act="setstatus" data-num="'+o.number+'"><option value="">Change status…</option>'+opts+'</select>':'<span class="psize">—</span>';
    var verify=(o.payment==='eft'&&o.status==='pending')?'<button class="btn btn-primary btn-sm" data-act="verify" data-num="'+o.number+'">✓ Verify EFT</button>':'';
    var proof=o.proof?'<br><span class="psize">📎 '+esc(o.proof)+'</span>':(o.payment==='eft'?'<br><span class="psize">no proof yet</span>':'');
    return '<tr><td><b>'+o.number+'</b><br><span class="psize">'+o.when+'</span></td>'
      +'<td>'+esc(o.customer)+(o.tier==='wholesale'?' <span class="tag-whole">WHOLE</span>':'')+'</td>'
      +'<td>'+(o.fulfillment==='delivery'?'🚚 Delivery':'🏬 Collection')+'</td>'
      +'<td>'+(o.payment==='cash'?'💵 Cash':(o.payment==='eft'?'🏦 EFT':'💳 Online'))+proof+'</td>'
      +'<td><b>'+zar(orderTotal(o))+'</b></td>'
      +'<td><span class="pill '+st.c+'">'+st.label+'</span></td>'
      +'<td>'+verify+' '+setter+'</td></tr>';
  }).join('');
  return '<div class="h1">Orders</div><p class="sub">Verify EFT payments and move orders through fulfilment.</p>'
    +(state.orders.length?'<div class="tablewrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Fulfil</th><th>Payment</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="empty"><div class="big">📦</div><p>No orders yet. Orders placed by distributors will appear here.</p></div>');
}
function adminSettings(){
  var s=state.settings;
  return '<div class="h1">Settings</div><p class="sub">Business details used across the store (demo).</p>'
    +'<form id="setForm" class="card" style="max-width:560px"><b>Banking details (for manual EFT)</b>'
    +'<label>Bank</label><input type="text" name="bankName" value="'+esc(s.bankName)+'">'
    +'<div class="row2"><div><label>Account name</label><input type="text" name="accName" value="'+esc(s.accName)+'"></div><div><label>Account number</label><input type="text" name="accNo" value="'+esc(s.accNo)+'"></div></div>'
    +'<div class="row2"><div><label>Branch code</label><input type="text" name="branch" value="'+esc(s.branch)+'"></div><div><label>Delivery fee (R)</label><input type="number" name="deliveryFee" step="0.01" value="'+(s.deliveryFee/100).toFixed(2)+'"></div></div>'
    +'<label>Low-stock alert threshold (units)</label><input type="number" name="lowStock" value="'+s.lowStock+'">'
    +'<label>Admin login name (your full name)</label><input type="text" name="adminName" value="'+esc(s.adminName||'Admin')+'">'
    +'<hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><b>Stock-taker admin (stock only)</b>'
    +'<div class="row2"><div><label>Stock-admin login name</label><input type="text" name="stockName" value="'+esc(s.stockName||'Stock')+'"></div><div><label>Stock-admin password</label><input type="text" name="stockPassword" value="'+esc(s.stockPassword||'stock123')+'"></div></div>'
    +'<button class="btn btn-primary" style="margin-top:14px" data-act="savesettings">Save settings</button></form>'
    +'<form id="pwForm" class="card" style="max-width:560px;margin-top:14px"><b>Change admin password</b>'
    +'<div class="row2"><div><label>New password</label><div class="pwwrap"><input type="password" id="newpw" name="newpw" required><button type="button" class="pwtoggle" data-target="newpw" aria-label="Show password">👁</button></div></div><div><label>Confirm new password</label><div class="pwwrap"><input type="password" id="newpw2" name="newpw2" required><button type="button" class="pwtoggle" data-target="newpw2" aria-label="Show password">👁</button></div></div></div>'
    +'<p class="psize">Used to log in as Admin via “View as ▸ Admin”. Minimum 4 characters.</p>'
    +'<button class="btn btn-primary" style="margin-top:6px" data-act="changeadminpw">Change password</button></form>';
}

/* ---------- actions ---------- */
document.addEventListener('click',function(e){var b=e.target.closest?e.target.closest('.pwtoggle'):null;if(!b)return;e.preventDefault();var inp=document.getElementById(b.getAttribute('data-target'));if(!inp)return;var show=inp.type==='password';inp.type=show?'text':'password';b.textContent=show?'🙈':'👁';b.setAttribute('aria-label',show?'Hide password':'Show password');});
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var act=t.getAttribute('data-act');
  if(act==='go'||act==='view'){go(t.getAttribute('data-view'));return;}
  if(act==='login-submit'){doLogin();return;}
  if(act==='login-cancel'){closeLogin();return;}
  if(act==='logout'){authed={};session.personaName='Guest';session.distName=null;session.distEmail=null;cart=[];save();go('#/shop');render();toast('Logged out');return;}
  if(isStockOnly()&&act!=='editstock'){toast('Stock-taker admin can update stock only');return;}  // block price/structural/other actions
  if(act==='reqdeal'){state.dealRequests.push({id:'req'+Date.now()+Math.floor(Math.random()*1000),business:persona().name,pkg:'8.5 Ton Maize Meal Package Deal',price:'R 60 000',when:'just now',status:'pending'});save();toast('Request sent to Suthisa for approval');return;}
  if(act==='reset'){if(confirm('Reset all demo data to the original sample?')){LS.removeItem(KEY);LS.removeItem(KEY+'-cart');cart=[];load();go('#/shop');render();toast('Demo data reset');}return;}
  if(act==='beadmin'){if(authed['Admin']){session.personaName='Admin';save();$('#persona').value='Admin';go('#/admin/dashboard');render();}else openLogin('Admin');return;}
  var id=t.getAttribute('data-id'), vid=t.getAttribute('data-vid'), num=t.getAttribute('data-num');

  if(act==='size'){detailSel[id].vid=vid;detailSel[id].qty=1;render();return;}
  if(act==='qty'){var sl=detailSel[id];sl.qty=Math.max(1,sl.qty+parseInt(t.getAttribute('data-d'),10));render();return;}
  if(act==='add'){if(!canOrder()){toast('Only approved distributors can order');return;}var sl2=detailSel[id];addToCart(sl2.vid,sl2.qty);toast('Added to cart');go('#/cart');return;}
  if(act==='cqty'){changeCartQty(vid,parseInt(t.getAttribute('data-d'),10));render();return;}
  if(act==='cremove'){cart=cart.filter(function(l){return l.vid!==vid;});save();render();toast('Removed');return;}
  if(act==='placeorder'){placeOrder();return;}

  if(act==='approve'){setDist(id,'approved');toast('Distributor approved');return;}
  if(act==='reject'){setDist(id,'rejected');toast('Application rejected');return;}
  if(act==='suspend'){setDist(id,'suspended');toast('Distributor suspended');return;}
  if(act==='approve-request'){var rq=state.dealRequests.filter(function(x){return x.id===id;})[0];if(rq){rq.status='approved';save();render();toast('Package request approved');}return;}
  if(act==='decline-request'){var rq2=state.dealRequests.filter(function(x){return x.id===id;})[0];if(rq2){rq2.status='declined';save();render();toast('Package request declined');}return;}
  if(act==='adddist'){e.preventDefault();addDistributor();return;}
  if(act==='verify'){setOrderStatus(num,'paid');toast('EFT payment verified · marked Paid');return;}
  if(act==='addprod'){e.preventDefault();addProduct();return;}
  if(act==='delproduct'){if(state.products.length<=1){toast('At least one product is required');return;}if(confirm('Delete this product and all its sizes?')){state.products=state.products.filter(function(x){return x.id!==id;});save();render();toast('Product removed');}return;}
  if(act==='delvariant'){for(var pi=0;pi<state.products.length;pi++){var vs=state.products[pi].variants,ix=-1;for(var k=0;k<vs.length;k++){if(vs[k].id===vid){ix=k;break;}}if(ix>=0){vs.splice(ix,1);break;}}save();render();toast('Size removed');return;}
  if(act==='addsize'){var ap=findProduct(id);if(ap){ap.variants.push({id:'v'+Date.now()+Math.floor(Math.random()*1000),kg:10,retail:0,wholesale:0,stock:0});save();render();toast('Size added — set its details');}return;}
  if(act==='savesettings'){e.preventDefault();saveSettings();return;}
  if(act==='changeadminpw'){e.preventDefault();var f=$('#pwForm');if(!f.reportValidity())return;var fd=new FormData(f);var a=fd.get('newpw'),b=fd.get('newpw2');if(!a||(''+a).length<4){toast('Password must be at least 4 characters');return;}if(a!==b){toast('Passwords do not match');return;}state.settings.adminPassword=a;save();render();toast('Admin password changed');return;}
  if(act==='submitdist'){e.preventDefault();submitDistributor();return;}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='persona'){var chosen=t.value;
    if(AUTH[chosen] && !authed[chosen]){t.value=session.personaName;openLogin(chosen);return;}
    session.personaName=chosen;save();var r=parse();if(persona().role==='admin')go('#/admin/dashboard');else if(r.view==='admin')go('#/shop');else render();return;}
  var act=t.getAttribute&&t.getAttribute('data-act');if(!act)return;
  if(isStockOnly()&&act!=='editstock')return;  // stock-taker admin: only stock quantity edits
  if(act==='setstatus'&&t.value){setOrderStatus(t.getAttribute('data-num'),t.value);toast('Status updated');return;}
  if(act==='editprice'){var fv=findVariant(t.getAttribute('data-vid'));if(fv){fv.v[t.getAttribute('data-tier')]=Math.round(parseFloat(t.value||0)*100);save();render();toast('Price updated');}return;}
  if(act==='editstock'){var fv2=findVariant(t.getAttribute('data-vid'));if(fv2){fv2.v.stock=parseInt(t.value||0,10);save();render();toast('Stock updated');}return;}
  if(act==='editsize'){var fvs=findVariant(t.getAttribute('data-vid'));if(fvs){fvs.v.kg=parseFloat(t.value||0);save();toast('Size updated');}return;}
  if(act==='editname'){var pn=findProduct(t.getAttribute('data-id'));if(pn){pn.name=t.value;save();toast('Name updated');}return;}
  if(act==='editcat'){var pc=findProduct(t.getAttribute('data-id'));if(pc){pc.cat=t.value;save();toast('Category updated');}return;}
  if(act==='uploadproof'){var o=orderByNum(t.getAttribute('data-num'));if(o){o.proof=(t.files&&t.files[0]?t.files[0].name:'proof.jpg');save();render();toast('Proof uploaded');}return;}
});
// keep checkout radios reactive
document.addEventListener('change',function(e){
  if(e.target.name==='fulfillment'){checkoutState.fulfillment=e.target.value;render();}
  if(e.target.name==='payment'){checkoutState.payment=e.target.value;render();}
});

/* ---------- mutations ---------- */
function addToCart(vid,qty){var l=cart.filter(function(x){return x.vid===vid;})[0];if(l)l.qty+=qty;else cart.push({vid:vid,qty:qty});save();}
function changeCartQty(vid,d){var l=cart.filter(function(x){return x.vid===vid;})[0];if(!l)return;l.qty+=d;if(l.qty<=0)cart=cart.filter(function(x){return x.vid!==vid;});save();}
function orderByNum(n){return state.orders.filter(function(o){return o.number===n;})[0];}
function setOrderStatus(n,s){var o=orderByNum(n);if(o){o.status=s;save();render();}}
function setDist(id,s){var d=state.distributors.filter(function(x){return x.id===id;})[0];if(d){d.status=s;save();render();}}

function placeOrder(){
  if(!canOrder()){toast('Only approved distributors can order');return;}
  var form=$('#checkoutForm');if(!form.reportValidity())return;
  var fd=new FormData(form);var f=checkoutState.fulfillment,pay=checkoutState.payment;
  var lines=cartLines();if(!lines.length)return;
  var num='ORD-'+(state.orderSeq++);
  var o={number:num,when:'just now',customer:fd.get('name'),tier:isWholesale()?'wholesale':'retail',
    fulfillment:f,payment:pay,status:'pending',proof:null,
    address:f==='delivery'?fd.get('address'):null,depot:f==='collection'?fd.get('depot'):null,
    delivery:f==='delivery'?state.settings.deliveryFee:0,
    items:lines.map(function(l){return {name:l.p.name,kg:l.v.kg,qty:l.qty,unit:l.unit};})};
  // decrement stock
  lines.forEach(function(l){var fv=findVariant(l.vid);if(fv)fv.v.stock=Math.max(0,fv.v.stock-l.qty);});
  state.orders.push(o);cart=[];save();
  go('#/confirm/'+num);render();
}
function addProduct(){
  var form=$('#addProd');if(!form.reportValidity())return;var fd=new FormData(form);
  var pid='p'+(Date.now());
  state.products.push({id:pid,name:fd.get('name'),cat:fd.get('cat')||'Staples',emoji:'🌾',desc:'Added via admin (demo).',
    variants:[{id:pid+'a',kg:parseInt(fd.get('kg'),10)||10,retail:Math.round(parseFloat(fd.get('retail'))*100),wholesale:Math.round(parseFloat(fd.get('wholesale'))*100),stock:parseInt(fd.get('stock'),10)||0}]});
  save();render();toast('Product added');
}
function saveSettings(){
  var form=$('#setForm');var fd=new FormData(form);var s=state.settings;
  s.bankName=fd.get('bankName');s.accName=fd.get('accName');s.accNo=fd.get('accNo');s.branch=fd.get('branch');
  s.deliveryFee=Math.round(parseFloat(fd.get('deliveryFee'))*100);s.lowStock=parseInt(fd.get('lowStock'),10)||0;s.adminName=(fd.get('adminName')||'').trim()||s.adminName;s.stockName=(fd.get('stockName')||'').trim()||s.stockName;s.stockPassword=(fd.get('stockPassword')||'').trim()||s.stockPassword;
  save();render();toast('Settings saved');
}
function submitDistributor(){
  var form=$('#distForm');if(!form.reportValidity())return;var fd=new FormData(form);
  state.distributors.push({id:'d'+Date.now(),name:fd.get('name'),surname:fd.get('surname'),phone:fd.get('phone'),alternatephone:fd.get('alternatephone'),email:fd.get('email'),address1:fd.get('address1'),address2:fd.get('address2'),city:fd.get('city'),province:fd.get('province'),status:'pending'});
  save();toast('Application submitted — awaiting approval');go('#/shop');render();
}
function addDistributor(){
  var form=$('#distAddForm');if(!form.reportValidity())return;var fd=new FormData(form);
  state.distributors.push({id:'d'+Date.now(),name:fd.get('name'),surname:fd.get('surname'),phone:fd.get('phone'),alternatephone:fd.get('alternatephone'),email:fd.get('email'),address1:fd.get('address1'),address2:fd.get('address2'),city:fd.get('city'),province:fd.get('province'),status:'approved'});
  save();render();toast('Approved distributor added');
}

/* ---------- boot ---------- */
load();
window.addEventListener('hashchange',render);
if(!location.hash)location.hash='#/shop';
render();
})();
</script>
</body>
